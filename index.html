<script>
/* Set the theme before first paint so a saved/system dark preference doesn't flash light first. */
(function(){
  try{
    var saved = localStorage.getItem('ctgr_theme');
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  }catch(e){}
})();
</script>
<script>
/* Keeps this page from going stale in a browser's cache (this trips up Safari especially).
   On load, and every so often while the tab is open, it fetches this same page fresh
   (bypassing the cache) and compares its build-id to the one actually on screen. If the
   two differ, it silently reloads to the current version — no "clear cache" needed. */
(function(){
  try{
    var meta = document.querySelector('meta[name="build-id"]');
    var CURRENT = meta ? meta.content : '';
    var SEEN_KEY = 'ctgr_seen_build';
    function checkForUpdate(){
      fetch(location.pathname, {cache: 'no-store'}).then(function(r){ return r.text(); }).then(function(html){
        var m = html.match(/name="build-id" content="([^"]+)"/);
        if(!m) return;
        var latest = m[1];
        if(latest !== CURRENT && sessionStorage.getItem(SEEN_KEY) !== latest){
          sessionStorage.setItem(SEEN_KEY, latest);
          location.replace(location.pathname + '?v=' + encodeURIComponent(latest) + location.hash);
        }
      }).catch(function(){});
    }
    checkForUpdate();
    setInterval(function(){ if(!document.hidden) checkForUpdate(); }, 10 * 60 * 1000);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkForUpdate(); });
  }catch(e){}
})();
</script>
<title>Cape Town & Garden Route, 14 Days / 13 Nights — Our Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#1c2b2d; --paper:#faf6ee; --paper-2:#f1ead9; --line:#d9cdb4;
  --ocean:#1f5f6b; --ocean-deep:#123840; --coral:#e2622e; --coral-soft:#f6d9c9;
  --gold:#c9942f; --sage:#6f8c5f; --white:#fff; --radius:14px;
  --shadow:0 8px 24px rgba(18,56,64,.10);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;line-height:1.55;}
body.ar{font-family:'Tajawal',sans-serif;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
body.ar h1,body.ar h2,body.ar h3,body.ar .display{font-family:'Tajawal',sans-serif;}
::selection{background:var(--coral-soft);}
a{color:var(--ocean-deep);}

.langbar{background:var(--ink);color:var(--paper);padding:9px 24px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;position:relative;z-index:80;}
.site-brand{display:flex;align-items:center;gap:9px;}
.site-logo{flex-shrink:0;display:block;}
.site-brand-text{font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:#dfeeec;letter-spacing:.01em;}
body.ar .site-brand-text{font-family:'Tajawal',sans-serif;font-style:normal;}
.langbtns{display:flex;gap:8px;}
@media(max-width:520px){.site-brand-text{display:none;}}
.langbtn{background:none;border:1px solid rgba(250,246,238,.3);color:var(--paper);padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:600;font-size:12.5px;}
.langbtn.active{background:var(--paper);color:var(--ink);}

.notice{background:#fff6ea;border:1px solid #e8d3a8;border-radius:12px;padding:14px 18px;font-size:13.5px;color:#5c4a26;max-width:1120px;margin:20px auto 0;}
.notice b{color:#3d3013;}

/* WEATHER PANEL */
.weather{max-width:1120px;margin:20px auto 0;background:linear-gradient(135deg,#fff,#fdf7ea);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);}
.weather-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.weather-head h2{margin:0;font-size:20px;}
.weather-tag{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:var(--ocean-deep);color:#fff;padding:3px 10px;border-radius:99px;}
.weather-cap{font-size:13px;color:#6b6157;margin:0 0 16px;}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px;}
.wstat{background:var(--paper-2);border-radius:12px;padding:12px 14px;}
.wstat .wv{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ocean-deep);}
body.ar .wstat .wv{font-family:'Tajawal',sans-serif;}
.wstat .wl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a7f70;margin-top:2px;}
.pack-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 20px;margin-top:10px;}
.pack-item{display:flex;gap:8px;font-size:13.5px;align-items:flex-start;}
.pack-item .ic{flex-shrink:0;}

.hero{position:relative;background:linear-gradient(160deg,var(--ocean-deep) 0%,var(--ocean) 55%,#2c7a72 100%);color:var(--paper);padding:48px 24px 90px;overflow:hidden;}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:70px;background:var(--paper);
  clip-path:polygon(0 100%,0 40%,4% 55%,9% 30%,14% 60%,19% 25%,24% 58%,29% 20%,34% 55%,39% 15%,44% 50%,49% 22%,54% 58%,59% 18%,64% 52%,69% 24%,74% 60%,79% 28%,84% 55%,89% 20%,94% 50%,100% 30%,100% 100%);}
.hero-inner{max-width:1120px;margin:0 auto;position:relative;z-index:2;}
.eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;color:var(--gold);display:flex;align-items:center;gap:10px;}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold);}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:600;margin:16px 0 8px;letter-spacing:-.01em;}
.hero h1 em{font-style:italic;color:#f6c98f;font-weight:400;}
.hero p.lead{max-width:660px;font-size:16.5px;color:#dfeeec;margin:0 0 24px;}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px;}
.hstat b{display:block;font-family:'Fraunces',serif;font-size:26px;font-weight:600;}
body.ar .hstat b{font-family:'Tajawal',sans-serif;}
.hstat span{font-size:12px;color:#bcdcd8;text-transform:uppercase;letter-spacing:.08em;}

.controls{position:sticky;top:0;z-index:50;background:rgba(250,246,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 24px;}
.controls-inner{max-width:1120px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:var(--white);padding:7px 14px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px;}
.chip .dot{width:8px;height:8px;border-radius:50%;}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.selcount{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--coral);color:#fff;padding:8px 14px;border-radius:99px;white-space:nowrap;cursor:pointer;border:none;font-weight:600;}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px 100px;}
.section-title{display:flex;align-items:baseline;gap:14px;margin:56px 0 6px;}
.section-title h2{font-size:26px;font-weight:600;margin:0;}
.section-title .n{font-family:'JetBrains Mono',monospace;color:var(--ocean);font-size:14px;}
.section-sub{color:#6b6157;font-size:14.5px;margin:0 0 20px;max-width:660px;}

#map{height:420px;border-radius:var(--radius);border:1px solid var(--line);margin:24px 0 8px;box-shadow:var(--shadow);position:relative;isolation:isolate;z-index:0;}
.map-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:#6b6157;margin-bottom:10px;}
.map-legend span{display:inline-flex;align-items:center;gap:6px;}
.map-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

.area-block{margin-top:44px;}

/* ITINERARY */
.day-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow);}
.day-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
.day-num{font-family:'JetBrains Mono',monospace;background:var(--ink);color:var(--paper);padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700;}
.day-head h3{margin:0;font-size:19px;font-weight:700;}
.day-tip{font-size:13px;color:#6b6157;margin:2px 0 16px;font-style:italic;}
.day-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ocean);margin-inline-start:auto;}
.hotel-box{display:flex;align-items:center;gap:12px;background:#f1e6fa;border:1px solid #d9c2ee;border-radius:12px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap;}
.hotel-ic{font-size:20px;}
.hotel-box b{font-size:14px;}
.hotel-meta{font-size:12px;color:#6b6157;margin-top:2px;}
.itin-chip-hotel{background:#f1e6fa;border-color:#d9c2ee;}
.slot{display:flex;gap:14px;padding:10px 0;border-top:1px dashed var(--line);}
.slot:first-of-type{border-top:none;}
.slot-label{flex-shrink:0;width:96px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ocean-deep);padding-top:3px;}
.slot-items{display:flex;flex-wrap:wrap;gap:8px;flex:1;}
.itin-chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px 6px 8px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;}
.itin-chip:hover{background:#e9e0cb;}
.itin-chip .ic-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.itin-chip .ic-book{color:var(--coral);font-size:10px;}
.itin-chip .ic-star{color:#a3791f;font-size:11px;}
.area-head{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:18px;}
.area-head .swatch{width:13px;height:13px;border-radius:4px;}
.area-head h3{font-size:21px;margin:0;font-weight:600;}
.area-head .count{margin-inline-start:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#8a7f70;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;transition:.15s;display:flex;flex-direction:column;}
.card.picked{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft);}


.slideshow{position:relative;height:180px;background:var(--paper-2);overflow:hidden;touch-action:pan-y;}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;cursor:zoom-in;}
.slide.show{display:block;}
.slide:focus-visible{outline:3px solid var(--coral);outline-offset:-3px;}
.ph-empty{position:absolute;inset:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#8a7f70;font-size:12.5px;font-weight:600;line-height:1.2;font-family:inherit;background:transparent;border:0;cursor:pointer;padding:8px;text-align:center;}
.ph-empty svg{opacity:.55;}
.ph-empty:hover{background:#eadfc6;color:var(--ocean-deep);}
.ph-empty:focus-visible{outline:3px solid var(--coral);outline-offset:-3px;}
.ph-btn{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(28,43,45,.62);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;padding:0 0 2px;}
.ph-btn:hover{background:rgba(28,43,45,.85);}
.ph-expand{position:absolute;bottom:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:8px;background:rgba(28,43,45,.55);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
.slide-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2;pointer-events:none;}
.slide-dots button{pointer-events:auto;width:7px;height:7px;border-radius:50%;border:none;background:rgba(255,255,255,.6);cursor:pointer;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
.slide-dots button.active{background:#fff;width:16px;border-radius:4px;}
.slide-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(28,43,45,.5);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;z-index:2;display:flex;align-items:center;justify-content:center;padding:0 0 2px;}
.slide-nav:hover{background:rgba(28,43,45,.8);}
.slide-nav.prev{left:6px;} .slide-nav.next{right:6px;}
body.ar .slide-nav.prev{left:auto;right:6px;} body.ar .slide-nav.next{right:auto;left:6px;}

/* PHOTO VIEWER */
body.lb-open{overflow:hidden;}
.lb{position:fixed;inset:0;z-index:1000;background:rgba(9,19,21,.97);color:#fff;display:flex;flex-direction:column;font-family:'Inter',sans-serif;}
.lb[hidden]{display:none;}
.lb-top{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));}
.lb-title{flex:1;min-width:0;}
.lb-title b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-title span{display:block;font-size:12px;color:#a9c4c1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.lb-btn{height:38px;min-width:38px;padding:0 12px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:600 13px 'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none;}
.lb-btn svg{flex-shrink:0;}
.lb-btn:hover{background:rgba(255,255,255,.2);}
.lb-btn.danger:hover{background:#b3473b;border-color:#b3473b;}
.lb-btn:focus-visible,.lb-nav:focus-visible,.lb-thumb:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media(max-width:820px){.lb-btn{padding:0;width:38px;} .lb-btn .t{display:none;}}
@media(hover:none){.lb-zoom{display:none;}}
.lb-main{position:relative;flex:1;min-height:0;}
.lb-stage{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:zoom-in;}
.lb-stage.zoomed{cursor:grab;}
.lb-stage.dragging{cursor:grabbing;}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transform-origin:50% 50%;will-change:transform;}
.lb-stage.loading::after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:lbspin .8s linear infinite;}
@keyframes lbspin{to{transform:rotate(360deg);}}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(9,19,21,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;padding:0 0 4px;}
.lb-nav:hover{background:rgba(255,255,255,.22);}
.lb-nav.prev{left:14px;} .lb-nav.next{right:14px;}
@media(max-width:640px){.lb-nav{width:38px;height:38px;font-size:22px;} .lb-nav.prev{left:8px;} .lb-nav.next{right:8px;}}
.lb-thumbs{display:flex;gap:8px;justify-content:safe center;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));overflow-x:auto;}
.lb-thumb{flex:0 0 auto;width:64px;height:48px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:#000;cursor:pointer;opacity:.55;}
.lb-thumb:hover{opacity:.9;}
.lb-thumb.active{border-color:var(--gold);opacity:1;}
.lb-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.lb-thumb.add{display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.4);font-size:22px;opacity:1;}
.lb-thumb.add:hover{background:rgba(255,255,255,.2);}

/* PHOTOS PANEL + TOAST */
.pp-back{position:fixed;inset:0;z-index:1100;background:rgba(18,40,44,.5);display:flex;align-items:center;justify-content:center;padding:18px;}
.pp-back[hidden]{display:none;}
.pp{background:var(--paper);border-radius:16px;padding:22px 24px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.pp h3{margin:0 0 8px;font-size:20px;}
.pp p{margin:0 0 12px;font-size:14px;color:#4d453c;}
.pp .pp-count{font-weight:700;color:var(--ocean-deep);}
.pp-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.pp-actions button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--white);font:600 14px 'Inter',sans-serif;color:var(--ink);cursor:pointer;}
body.ar .pp-actions button{font-family:'Tajawal',sans-serif;}
.pp-actions button:hover{background:var(--paper-2);}
.pp-actions .pp-primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pp-actions .pp-primary:hover{background:var(--ocean-deep);}
.pp-actions .pp-danger{color:#b3473b;}
.pp-actions button:disabled{opacity:.45;cursor:default;}
.pp-sync{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;}
.pp-sync h4{margin:0 0 6px;font-size:15px;}
.pp-status{font-weight:600;color:var(--ocean-deep);font-size:13px;}
.pp-sync label{display:block;margin-bottom:10px;font-size:12.5px;font-weight:600;color:#6b6157;}
.pp-sync label input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:14px 'Inter',sans-serif;background:var(--white);color:var(--ink);}
.pp-sync label input:focus{outline:none;border-color:var(--ocean);}
.pp-sync > button,#ghForm > button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--white);font:600 14px 'Inter',sans-serif;color:var(--ink);cursor:pointer;}
#ghForm > button.pp-primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
body.ar .pp-sync label input,body.ar .pp-sync > button,body.ar #ghForm > button{font-family:'Tajawal',sans-serif;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:1300;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%);}
@media(prefers-reduced-motion:reduce){.lb-stage.loading::after{animation-duration:2.4s;} .toast{transition:none;}}

/* SCROLL FABS */
.scroll-fabs{position:fixed;inset-inline-end:18px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:80;}
.scroll-fab{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--ocean-deep);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s,transform .18s,background .18s,color .18s;}
.scroll-fab.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.scroll-fab:hover{background:var(--ocean-deep);color:#fff;border-color:var(--ocean-deep);}
@media(prefers-reduced-motion:reduce){.scroll-fab{transition:opacity .18s;}}
@media print{.scroll-fabs{display:none !important;}}

.card-body{padding:16px 18px;display:flex;flex-direction:column;gap:9px;flex:1;}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.card-top h4{margin:0;font-size:16px;font-weight:700;line-height:1.3;}
.pick-btn{border:1.5px solid var(--line);background:var(--paper);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:15px;color:#8a7f70;}
.card.picked .pick-btn{background:var(--coral);border-color:var(--coral);color:#fff;}
.catpill{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;white-space:nowrap;align-self:flex-start;}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.cuisine-pill{background:var(--paper-2);color:#5c534a;}
.rating-pill{font-size:11.5px;font-weight:700;color:#a3791f;background:#fdf3de;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.rating-pill i{font-style:normal;color:#8a7f70;font-weight:600;}
.mynote{font-size:12.5px;color:#7a5a1e;background:#fff3d9;border:1px dashed #e0be6f;border-radius:8px;padding:6px 10px;}
.about{font-size:13px;color:#4d453c;margin:0;line-height:1.55;}
.wear{font-size:12.5px;color:#5c6f52;background:#eef3e9;border-radius:8px;padding:6px 10px;display:flex;gap:6px;align-items:flex-start;}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#6b6157;padding:8px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);}
.meta-row div{display:flex;align-items:center;gap:5px;}
.meta-row b{color:var(--ink);font-weight:700;}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;}
.mini-link{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:5px;background:var(--white);cursor:pointer;}
.mini-link:hover{background:var(--paper-2);}
.mini-link.primary{background:var(--ocean-deep);color:#fff;border-color:var(--ocean-deep);}
.mini-link.primary:hover{background:var(--ocean);}
.mini-link.verified::after{content:"✓";color:var(--sage);font-weight:800;margin-inline-start:2px;}
.badge-book{font-size:11px;font-weight:700;color:var(--coral);display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.04em;}
.badge-book::before{content:"●";font-size:8px;}
.steps-toggle{font-size:12.5px;font-weight:600;color:var(--ocean-deep);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:none;padding:0;text-align:start;}
.steps{display:none;background:var(--paper-2);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:2px;}
.steps.open{display:block;}
.steps ol{margin:0;padding-inline-start:18px;}
.steps li{margin-bottom:5px;}
.steps .book-link{display:inline-block;margin-top:6px;font-weight:700;color:var(--coral);}
.steps .book-phone{display:block;margin-top:6px;font-size:12.5px;color:#4d453c;}
.steps .book-phone a{color:var(--ocean-deep);font-weight:600;}

.drawer-backdrop{position:fixed;inset:0;background:rgba(18,40,44,.4);display:none;z-index:99;}
.drawer-backdrop.open{display:block;}
.drawer{position:fixed;top:0;inset-inline-end:-420px;width:400px;max-width:92vw;height:100%;background:var(--paper);z-index:100;box-shadow:-10px 0 40px rgba(0,0,0,.2);transition:inset-inline-end .25s ease;display:flex;flex-direction:column;}
.drawer.open{inset-inline-end:0;}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.drawer-head h3{margin:0;font-size:20px;}
.drawer-close{border:none;background:none;font-size:22px;cursor:pointer;color:var(--ink);}
.drawer-body{padding:16px 22px;overflow-y:auto;flex:1;}
.drawer-empty{color:#8a7f70;font-size:14px;padding:30px 0;text-align:center;}
.d-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--paper-2);font-size:14px;}
.d-item .rm{border:none;background:none;color:#b3473b;cursor:pointer;font-size:13px;font-weight:600;}
.d-area-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a7f70;margin-top:16px;font-weight:700;}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--line);}
.drawer-foot button{width:100%;padding:12px;border-radius:10px;border:none;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer;font-size:14px;}

footer{max-width:1120px;margin:0 auto;padding:40px 24px 60px;color:#8a7f70;font-size:13px;border-top:1px solid var(--line);}
.signature-row{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;}
.signature{font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:#a89a82;}
body.ar .signature{font-family:'Tajawal',sans-serif;font-style:normal;}
.contact-links{display:flex;flex-wrap:wrap;gap:12px;}
.contact-links a{font-size:12px;color:#8a7f70;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 11px;transition:.15s;}
.contact-links a:hover{background:var(--paper-2);color:var(--ink);}

/* TRAVEL NOTICE */
.travel-notice{max-width:1120px;margin:16px auto 0;background:#eef3f7;border:1px solid #c8d8e2;border-radius:12px;padding:14px 18px;}
.tn-head{font-weight:700;font-size:13.5px;color:#1f4d5f;margin-bottom:8px;}
.tn-links{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
.tn-link{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #c8d8e2;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;}
.tn-link:hover{background:#dceaf1;}
.tn-cap{font-size:11.5px;color:#5c6b73;margin:4px 0 0;}

/* MAIN TABS */
.maintabs{max-width:1120px;margin:18px auto 0;padding:0 24px;display:flex;gap:8px;}
.maintab{flex:1;background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;color:#8a7f70;display:flex;align-items:center;justify-content:center;gap:8px;}
.maintab .mt-num{width:20px;height:20px;border-radius:50%;background:var(--paper-2);color:#8a7f70;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;}
.maintab.active{border-color:var(--ink);color:var(--ink);background:var(--paper-2);}
.maintab.active .mt-num{background:var(--ink);color:var(--paper);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
@media(max-width:640px){.maintab span:not(.mt-num){display:none;} .maintab{gap:0;}}

/* GARDEN ROUTE */
.gr-town{margin-top:40px;}
.gr-town-head{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:16px;}
.gr-town-head h3{margin:0;font-size:20px;}
.gr-town-head .gr-pin{font-size:18px;}
.gr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.gr-card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.gr-card-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
.gr-card h4{margin:0;font-size:14.5px;font-weight:700;}
.gr-card .about{font-size:12.5px;}
.gr-card .mynote{font-size:11.5px;padding:5px 8px;}
.gr-card-actions{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap;}

/* SAFARI */
.saf-compare-wrap{overflow-x:auto;margin:20px 0 36px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
table.saf-compare{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
table.saf-compare th,table.saf-compare td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;}
table.saf-compare th{background:var(--ink);color:var(--paper);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;}
table.saf-compare tr:last-child td{border-bottom:none;}
table.saf-compare tr:nth-child(even) td{background:var(--paper-2);}
.saf-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow);}
.saf-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.saf-card-head h3{margin:0;font-size:19px;}
.saf-price-tag{font-family:'JetBrains Mono',monospace;background:var(--paper-2);color:var(--ocean-deep);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;}
.saf-big5{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
.saf-big5 span{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef3e9;color:#4a6b3a;}
.saf-big5 span.no{background:#f5e9e5;color:#8a4a3a;text-decoration:line-through;opacity:.6;}
.saf-mynote{margin:10px 0;}

/* TRANSPORT */
.tt-block{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.tt-block h3{margin:0 0 8px;font-size:16.5px;display:flex;align-items:center;gap:8px;}
.tt-block p{margin:0;font-size:13.5px;color:#4d453c;line-height:1.6;}
.tt-block ul{margin:8px 0 0;padding-inline-start:20px;font-size:13.5px;color:#4d453c;line-height:1.7;}
.tt-rental-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px;}
.tt-rental-card{background:var(--paper-2);border-radius:10px;padding:12px 14px;}
.tt-rental-card b{font-size:14px;}
.tt-rental-card .rating-pill{margin-top:6px;display:inline-block;}
.rec-badge{display:block;font-size:11px;font-weight:800;color:#8a4fae;background:#f1e6fa;border-radius:6px;padding:3px 8px;margin-bottom:6px;width:fit-content;}

/* BUDGET */
.budget-bar{max-width:1120px;margin:14px auto 0;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;font-weight:700;font-size:14px;box-shadow:var(--shadow);}

/* SEARCH */
.search-wrap{max-width:1120px;margin:14px auto 0;padding:0 24px;position:relative;z-index:70;}
@keyframes ctgrAutofillStart { from {opacity:.9999;} to {opacity:1;} }
@keyframes ctgrAutofillCancel { from {opacity:.9999;} to {opacity:1;} }
.search-input:-webkit-autofill{ animation-name: ctgrAutofillStart; animation-duration: 1ms; }
.search-input:not(:-webkit-autofill){ animation-name: ctgrAutofillCancel; animation-duration: 1ms; }
.search-input{width:100%;padding:13px 18px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;font-family:'Inter',sans-serif;background:var(--white);box-shadow:var(--shadow);;-webkit-appearance:none;appearance:none;}
body.ar .search-input{font-family:'Tajawal',sans-serif;}
.search-input:focus{outline:none;border-color:var(--ocean);}
.search-results{position:absolute;top:calc(100% + 6px);left:24px;right:24px;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(18,56,64,.18);max-height:420px;overflow-y:auto;z-index:60;}
.sr-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--paper-2);cursor:pointer;text-decoration:none;color:var(--ink);}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--paper-2);}
.sr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sr-name{font-weight:700;font-size:13.5px;flex:1;}
.sr-meta{font-size:11.5px;color:#8a7f70;white-space:nowrap;}
.sr-empty{padding:16px;text-align:center;color:#8a7f70;font-size:13px;}
.budget-bar:hover{background:var(--ocean-deep);}
.budget-total{font-family:'JetBrains Mono',monospace;color:#f6c98f;}
.budget-note{margin-inline-start:auto;font-size:11.5px;font-weight:500;color:#bcdcd8;}
.price-pill{font-size:11.5px;font-weight:700;color:#3a6b4a;background:#e9f3ea;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.weak-pill{font-size:11px;font-weight:700;color:#8a4f1e;background:#faecd9;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.d-price{font-style:normal;color:#8a7f70;font-size:12px;}
.d-total{display:flex;justify-content:space-between;padding:14px 0 4px;margin-top:8px;border-top:2px solid var(--ink);font-size:14px;font-weight:700;}

/* EMERGENCY */
.emg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px;}
.emg-card{background:var(--paper-2);border-radius:10px;padding:12px 14px;}
.emg-card b{font-size:13.5px;display:block;margin-bottom:4px;}
.emg-card .emg-line{font-size:12.5px;color:#4d453c;line-height:1.6;}
.emg-nums{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.emg-num{background:#fdf3de;border-radius:8px;padding:8px 12px;font-size:13px;}
.emg-num b{font-family:'JetBrains Mono',monospace;color:#a3791f;}

@media(max-width:640px){#map{height:300px;}.hero{padding:36px 18px 80px;}}

/* ITINERARY PDF */
.pdf-btn{display:inline-flex;align-items:center;gap:8px;margin:0 0 6px;padding:10px 18px;border-radius:99px;border:0;background:var(--ink);color:var(--paper);font:600 14px 'Inter',sans-serif;cursor:pointer;}
body.ar .pdf-btn{font-family:'Tajawal',sans-serif;}
.pdf-btn:hover{background:var(--ocean-deep);}
.pdf-btn::before{content:"⬇";font-size:13px;}
#printDoc{display:none;}
@media print{
  @page{size:A4;margin:12mm 12mm 14mm;}
  html,body{background:#fff !important;}
  .langbar,.controls,.search-wrap,.maintabs,.budget-bar,.drawer,.drawer-backdrop,.lb,.pp-back,.toast{display:none !important;}
  body.printing > *:not(#printDoc){display:none !important;}
  body.printing #printDoc{display:block;}
  #printDoc{color:#1c2b2d;font-family:'Inter',sans-serif;font-size:9.5pt;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.ar #printDoc{font-family:'Tajawal',sans-serif;}
  #printDoc h1,#printDoc h2,#printDoc h3,#printDoc h4{font-family:'Fraunces',serif;margin:0;}
  body.ar #printDoc h1,body.ar #printDoc h2,body.ar #printDoc h3,body.ar #printDoc h4{font-family:'Tajawal',sans-serif;}
  #printDoc a{color:inherit;text-decoration:none;}
  #printDoc .pd-link{color:#123840;text-decoration:underline;text-underline-offset:1.5px;font-size:8.5pt;font-weight:600;margin-inline-end:10px;}

  .pd-cover h1{font-size:26pt;line-height:1.1;margin:4mm 0 3mm;color:#123840;}
  .pd-kicker{font-size:9pt;letter-spacing:.04em;color:#c9942f;font-weight:700;border-bottom:1.2pt solid #c9942f;padding-bottom:2mm;}
  .pd-h3{font-size:11pt;color:#123840;margin:4mm 0 1.5mm !important;}
  table.pd-glance{width:100%;border-collapse:collapse;font-size:8.4pt;}
  table.pd-glance th{background:#1c2b2d;color:#faf6ee;text-align:start;padding:1.4mm 2.5mm;font-size:7.8pt;}
  table.pd-glance td{padding:1.4mm 2.5mm;border-bottom:.4pt solid #d9cdb4;vertical-align:top;}
  table.pd-glance tr:nth-child(even) td{background:#f6f0e2;}
  table.pd-glance tr{break-inside:avoid;}
  .pd-foot{margin-top:3mm;font-size:8pt;color:#8a7f70;}

  .pd-day{break-before:page;}
  .pd-dayhead{display:flex;align-items:center;gap:3mm;background:#123840;color:#faf6ee;padding:3mm 4mm;border-radius:2.5mm;break-after:avoid;}
  .pd-dayhead h2{font-size:14pt;flex:1;line-height:1.2;}
  .pd-daynum{background:#c9942f;color:#1c2b2d;font-weight:800;font-size:9pt;padding:1mm 3mm;border-radius:99px;white-space:nowrap;}
  .pd-date{font-size:9pt;color:#bcdcd8;white-space:nowrap;}
  .pd-tip{font-style:italic;color:#5c534a;margin:3mm 0 2mm;}
  .pd-hotel,.pd-staying{display:flex;align-items:center;gap:3mm;background:#f1e6fa;border:.5pt solid #d9c2ee;border-radius:2.5mm;padding:2.5mm 3.5mm;margin:2mm 0 3mm;break-inside:avoid;}
  .pd-staying{font-size:9pt;}
  .pd-hotel-ic{font-size:14pt;}
  .pd-hotel-main{flex:1;}
  .pd-sub{font-size:8.5pt;color:#6b6157;}
  .pd-slot{margin-top:3mm;}
  .pd-slotlabel{font-size:8.5pt;font-weight:800;color:#1f5f6b;text-transform:uppercase;letter-spacing:.03em;border-bottom:.5pt dashed #d9cdb4;padding-bottom:.8mm;break-after:avoid;}
  body.ar .pd-slotlabel{text-transform:none;letter-spacing:0;}

  .pd-item{display:flex;gap:4mm;align-items:flex-start;padding:2mm 0;padding-inline-start:3mm;margin:2mm 0;border-inline-start:1.2mm solid var(--c,#6f8c5f);break-inside:avoid;}
  .pd-plain{border-inline-start-color:#d9cdb4;}
  .pd-main{flex:1;min-width:0;}
  .pd-item h4{font-size:10.5pt;line-height:1.25;margin-bottom:.8mm;}
  .pd-meta{display:flex;flex-wrap:wrap;align-items:center;gap:1.5mm 2mm;font-size:8.5pt;color:#6b6157;margin-bottom:1mm;}
  .pd-pill{font-size:7.5pt;font-weight:700;padding:.4mm 2mm;border-radius:1.5mm;color:var(--c);background:#fff;border:.5pt solid var(--c);}
  .pd-soft{--c:#8a7f70;}
  .pd-about{margin:0 0 1.2mm;font-size:9pt;color:#3d362f;}
  .pd-facts{display:flex;flex-wrap:wrap;gap:.4mm 5mm;font-size:8.5pt;margin:0 0 1.2mm;}
  .pd-fact b{color:#8a7f70;font-weight:700;margin-inline-end:1mm;}
  .pd-note{font-size:8.5pt;background:#fff3d9;border:.5pt dashed #e0be6f;border-radius:1.5mm;padding:.8mm 2mm;margin-bottom:1.2mm;display:inline-block;}
  .pd-book{font-size:8.5pt;background:#fdf1ea;border-radius:1.5mm;padding:1.2mm 2.5mm;margin-bottom:1.2mm;}
  .pd-book b{color:#c4501f;}
  .pd-book ol{margin:.8mm 0 .8mm;padding-inline-start:4.5mm;}
  .pd-links{margin-top:.5mm;}
  .pd-photos{display:flex;gap:1.6mm;flex-shrink:0;}
  .pd-photos img{width:23mm;height:17mm;object-fit:cover;border-radius:1.5mm;border:.4pt solid #cfc4ad;display:block;}
  .pd-total{margin-top:6mm;padding:3mm 4mm;background:#1c2b2d;color:#faf6ee;border-radius:2.5mm;font-size:10pt;break-inside:avoid;}
  .pd-total b{color:#f6c98f;}
  .pd-total span{font-size:8pt;color:#bcdcd8;}
}

/* WEATHER (live) */
.weather-head .wx-refresh{margin-inline-start:auto;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 12.5px 'Inter',sans-serif;cursor:pointer;}
body.ar .weather-head .wx-refresh{font-family:'Tajawal',sans-serif;}
.weather-head .wx-refresh:hover{background:var(--paper-2);}
.wx-now{display:flex;align-items:center;gap:16px 26px;flex-wrap:wrap;background:linear-gradient(135deg,var(--ocean-deep),var(--ocean));color:#fff;border-radius:14px;padding:16px 20px;margin:0 0 16px;}
.wx-now.wx-empty{display:block;color:#dfeeec;font-size:14px;}
.wx-now-ic{background:rgba(255,255,255,.94);border-radius:50%;width:92px;height:92px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.wx-now-place{font-size:12px;color:#bcdcd8;margin-bottom:2px;}
.wx-now-temp{font-family:'Fraunces',serif;font-size:48px;line-height:1;font-weight:600;}
body.ar .wx-now-temp{font-family:'Tajawal',sans-serif;}
.wx-now-temp span{font-size:20px;font-weight:400;margin-inline-start:2px;color:#dfeeec;}
.wx-now-cond{font-size:15px;font-weight:600;margin-top:4px;}
.wx-now-facts{display:grid;grid-template-columns:repeat(4,auto);gap:8px 28px;margin-inline-start:auto;}
.wx-now-facts b{display:block;font-size:17px;font-weight:700;}
.wx-now-facts small{font-size:11px;font-weight:500;color:#bcdcd8;}
.wx-now-facts span{font-size:11.5px;color:#bcdcd8;}
@media(max-width:700px){.wx-now-facts{grid-template-columns:repeat(2,auto);margin-inline-start:0;width:100%;} .wx-now-ic{width:76px;height:76px;} .wx-now-ic svg{width:60px;height:60px;}}
.wx-h{font-size:15px;margin:4px 0 10px;}
.wx-strip{display:grid;grid-auto-flow:column;grid-auto-columns:112px;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scroll-snap-type:x proximity;}
@media(min-width:900px){.wx-strip{grid-auto-flow:row;grid-template-columns:repeat(7,1fr);grid-auto-columns:auto;overflow:visible;padding-bottom:2px;}}
.wx-day{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 8px 9px;text-align:center;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:2px;}

.wx-d2{font-size:12px;font-weight:700;}
.wx-ic{height:46px;margin:2px 0;display:flex;align-items:center;}
.wx-cond{font-size:11.5px;color:#6b6157;min-height:16px;}
.wx-t{display:flex;align-items:baseline;gap:6px;}
.wx-t b{font-size:17px;font-family:'Fraunces',serif;}
body.ar .wx-t b{font-family:'Tajawal',sans-serif;}
.wx-t span{color:#8a7f70;font-size:14px;}
.wx-meta{display:flex;gap:10px;font-size:11.5px;color:#4d6f78;}
.wx-meta span{display:inline-flex;align-items:center;gap:3px;}
.wx-badge{margin-top:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:#8a7f70;}
.is-fc .wx-badge{background:var(--ocean);border-color:var(--ocean);color:#fff;}
.wx-loc{font-size:10.5px;color:#a89a82;}
.wx-note{font-size:11.5px;color:#8a7f70;margin:6px 0 16px;}
.wx-note a{color:inherit;}
.wstat{display:flex;gap:10px;align-items:flex-start;}
.wstat .wi{color:var(--ocean);flex:0 0 auto;margin-top:1px;}
@media(min-width:900px){.weather-grid{grid-template-columns:repeat(4,1fr);}}
.wstat .wv{font-size:19px;}
.wstat .wv,.wx-t,.wx-meta span,.wx-now-temp,.wx-now-facts b{direction:ltr;unicode-bidi:isolate;}
body.ar .wstat .wv,body.ar .wx-now-facts b{text-align:right;}
body.ar .wx-t,body.ar .wx-now-temp{justify-content:center;}

/* WEATHER v2: tabs, date picker, hourly, details */
.wx-live{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:99px;padding:1px 9px;font-size:10.5px;font-weight:700;letter-spacing:.04em;margin-inline-start:6px;vertical-align:middle;}
.wx-live::before{content:"";width:6px;height:6px;border-radius:50%;background:#5be08a;animation:wxpulse 1.8s ease-in-out infinite;}
@keyframes wxpulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@media(prefers-reduced-motion:reduce){.wx-live::before{animation:none;}}
.wx-hours-t{font-size:12.5px;font-weight:700;color:#6b6157;margin:0 0 6px;}
.wx-hours-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scroll-snap-type:x proximity;}
.wx-hr{flex:0 0 68px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#4d6f78;scroll-snap-align:start;}
.wx-hr.is-now{border-color:var(--ocean);box-shadow:0 0 0 1px var(--ocean) inset;}
.wx-hr-t{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ocean);}
.wx-hr b{font-size:14.5px;color:var(--ink);font-family:'Fraunces',serif;}
body.ar .wx-hr b{font-family:'Tajawal',sans-serif;}
.wx-hr span{display:inline-flex;align-items:center;gap:3px;direction:ltr;unicode-bidi:isolate;}
.wx-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px;}
.wx-tab{border:1.5px solid var(--line);background:var(--white);color:var(--ink);padding:8px 16px;border-radius:99px;font:600 13.5px 'Inter',sans-serif;cursor:pointer;}
body.ar .wx-tab,body.ar .wx-ctrl button,body.ar .wx-ctrl input{font-family:'Tajawal',sans-serif;}
.wx-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.wx-ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:8px;}
.wx-ctrl > div{display:flex;align-items:center;gap:8px;}
.wx-ctrl button{border:1.5px solid var(--line);background:var(--white);color:var(--ink);border-radius:99px;padding:7px 14px;font:600 13px 'Inter',sans-serif;cursor:pointer;}
#wxLocToggle button.active{background:var(--ocean-deep);border-color:var(--ocean-deep);color:#fff;}
#wxPrev,#wxNext{width:36px;height:36px;padding:0 0 2px;font-size:20px;line-height:1;}
body.ar #wxPrev,body.ar #wxNext{transform:scaleX(-1);}
#wxDate{border:1.5px solid var(--line);background:var(--white);color:var(--ink);border-radius:10px;padding:7px 10px;font:600 14px 'Inter',sans-serif;min-height:36px;}
#wxDate:focus,.wx-tab:focus-visible,.wx-ctrl button:focus-visible,.wx-day:focus-visible{outline:2px solid var(--coral);outline-offset:2px;}
.wx-range{font-size:14.5px;font-weight:700;margin:4px 0 10px;}
.wx-load{grid-column:1 / -1;padding:22px 10px;text-align:center;color:#8a7f70;font-size:13.5px;}
button.wx-day{font:inherit;color:inherit;cursor:pointer;}
.wx-day > span{display:block;}
.wx-day .wx-ic{display:flex;justify-content:center;}
.wx-day .wx-t,.wx-day .wx-meta{display:flex;justify-content:center;}
.wx-day.is-forecast{border-color:var(--ocean);box-shadow:0 0 0 1px var(--ocean) inset;}
.wx-day.is-forecast .wx-badge{background:var(--ocean);border-color:var(--ocean);color:#fff;}
.wx-day.is-recorded .wx-badge{background:#eef3e9;border-color:#b9cca9;color:#4a6b3a;}
.wx-day.is-sel{outline:2.5px solid var(--coral);outline-offset:1px;}
.wx-detail:not(:empty){margin-top:12px;background:var(--paper-2);border-radius:12px;padding:14px 16px;}
.wx-detail-h{display:flex;gap:12px;align-items:center;margin-bottom:10px;}

.wx-detail-h span{font-size:12.5px;color:#6b6157;}
.wx-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px 14px;}
.wx-detail-grid span{display:block;font-size:11px;color:#8a7f70;text-transform:uppercase;letter-spacing:.04em;}
body.ar .wx-detail-grid span{text-transform:none;letter-spacing:0;}

.wx-detail-note{margin:10px 0 0;font-size:12px;color:#6b6157;font-style:italic;}

.ph-static{cursor:default;} .ph-empty.ph-static:hover{background:transparent;color:#8a7f70;}

/* DARK MODE — the whole page is one consistent light palette built from a handful of custom
   properties plus a lot of hand-picked warm grays, so instead of re-deriving a second palette
   for every rule, we invert the page's lightness and spin the hue back to where it started.
   Photos, the map, the photo-viewer chrome and hand-colored art (the logo, weather icons) get
   the same filter a second time, which cancels the inversion for just that subtree. */
:root[data-theme="dark"]{ color-scheme:dark; background:#0e1614; }   /* :root IS html — no descendant combinator needed/possible here */
:root[data-theme="dark"] body{ filter:invert(1) hue-rotate(180deg); }
:root[data-theme="dark"] img,
:root[data-theme="dark"] video,
:root[data-theme="dark"] #map,
:root[data-theme="dark"] .lb,
:root[data-theme="dark"] .wx-svg,
:root[data-theme="dark"] .site-logo{ filter:invert(1) hue-rotate(180deg); }
@media print{ :root[data-theme="dark"] body{ filter:none !important; } }
.theme-icon{display:block;}
</style>
</head>

<script>
/* ---------- PHOTO STORAGE (IndexedDB; falls back to memory if the browser blocks it) ---------- */
const photoDB = (function(){
  const mem = new Map();
  let dbPromise = null;
  function open(){
    if(!dbPromise) dbPromise = new Promise(resolve=>{
      let done = false; const fin = v=>{ if(!done){ done = true; resolve(v); } };
      setTimeout(()=>fin(null), 3000);            // Safari can leave open() hanging: never wait more than 3s
      try{
        const req = indexedDB.open('trip-planner-photos', 1);
        req.onupgradeneeded = ()=>req.result.createObjectStore('photos');
        req.onsuccess = ()=>fin(req.result);
        req.onerror = req.onblocked = ()=>fin(null);
      }catch(e){ fin(null); }
    });
    return dbPromise;
  }
  async function write(fn){
    const db = await open(); if(!db) return false;
    return new Promise(resolve=>{
      try{
        const tx = db.transaction('photos','readwrite'); fn(tx.objectStore('photos'));
        tx.oncomplete = ()=>resolve(true); tx.onerror = tx.onabort = ()=>resolve(false);
      }catch(e){ resolve(false); }
    });
  }
  return {
    async all(){
      const db = await open(), out = {};
      if(!db){ mem.forEach((v,k)=>{ out[k]=v; }); return out; }
      return new Promise(resolve=>{
        try{
          const req = db.transaction('photos','readonly').objectStore('photos').openCursor();
          req.onsuccess = ()=>{ const c = req.result; if(c){ out[c.key] = c.value; c.continue(); } else resolve(out); };
          req.onerror = ()=>resolve(out);
        }catch(e){ resolve(out); }
      });
    },
    async put(key, blob){ if(!(await write(s=>s.put(blob,key)))) mem.set(key, blob); },
    async del(key){ mem.delete(key); await write(s=>s.delete(key)); },
    async clear(){ mem.clear(); await write(s=>s.clear()); },
  };
})();

  tnCaption:"إقرار الجمارك مطلوب عند الدخول/الخروج — أكملاه عبر أداة SARS أعلاه. رابط منشور السفارة مضاف مباشرة لأنه تعذّر قراءته آليًا هنا — فضلاً افتحاه بأنفسكما للاطلاع على محتواه الحالي. الأسعار الموضحة بالريال السعودي محوّلة بسعر تقريبي ١ راند جنوب أفريقي ≈ ٠.٢١ ريال سعودي (يوليو ٢٠٢٦) — الحجوزات الفعلية تُدفع بالراند الجنوب أفريقي، لذا أُبقي المبلغ بالراند بجانبها كمرجع وهو المبلغ الفعلي الذي سيُخصم.",

  ttTitle:"التنقل", ttCarTitle:"استئجار سيارة (يُنصح به لطريق الحدائق)", ttCarBody:"القيادة الذاتية هي أسهل طريقة لطريق الحدائق — لا يكاد يوجد نقل عام بين البلدات. Woodford Car Hire هي الخيار الموصى به أدناه — أكبر شركة تأجير سيارات مستقلة في جنوب أفريقيا، وبأفضل تقييم جوجل بين الأربعة، ولها فرع في مطار كيب تاون الدولي. أحضرا ثلاثة مستندات لمكتب التأجير: جواز السفر، رخصة القيادة الدولية (IDP)، والرخصة السعودية الأصلية. شركات التأجير في جنوب أفريقيا تطلب عادة الثلاثة معًا — رخصة القيادة الدولية وحدها غير صالحة دون الرخصة الأصلية التي تترجمها.",

  ttUberTitle:"أوبر في كيب تاون", ttUberBody:"أوبر يعمل جيدًا ورخيص داخل كيب تاون نفسها (وسط المدينة، الواجهة البحرية، سي بوينت، كامبس باي إلخ). لكنه ليس خيارًا جيدًا لكيب بوينت، رأس تشابمان، هاوت باي، منطقة الكروم، أو أي مكان على طريق الحدائق — الرحلات مكلفة، وأوقات الانتظار طويلة، وبعض الأماكن (محميات الحيوانات، بدايات مسارات التنزه، المطلات النائية) لا تغطيها الخدمة إطلاقًا. استخدما أوبر لأيام المدينة، واستأجرا سيارة أو سائقًا لبقية الرحلة.",
  ttDriverTitle:"خيار السائق الخاص", ttDriverBody:"إن كنتما تفضلان عدم القيادة الذاتية (خصوصًا للمسافات الطويلة في طريق الحدائق أو التنقل للسفاري)، فالسائق/المرشد الخاص خيار شائع ومريح في كيب تاون — يتولى القيادة ويمكنه شرح الطريق لكما. اسألا موظف الاستقبال بالفندق أو ابحثا عن \"private driver Cape Town Garden Route\" — الأسعار تختلف حسب اليوم/المسافة، فاطلبا عرض سعر لمسارك تحديدًا.",
  ttFlightTitle:"رحلة داخلية: كيب تاون ↔ جورج", ttFlightBody:"توجد رحلة داخلية قصيرة (حوالي ساعة) بين مطار كيب تاون الدولي (CPT) ومطار جورج (GRJ)، تشغّلها شركات طيران جنوب أفريقية. مفيدة في طريق العودة إن فضّلتما عدم قيادة كامل المسافة — طيرا من جورج إلى كيب تاون وتجنبا ١-٢ يوم من القيادة. إن عدتما بالطائرة، يمكنكما أيضًا تسليم سيارة الإيجار في مطار جورج بدل قيادتها كاملة إلى كيب تاون (معظم الشركات تسمح بالتسليم في مكان مختلف مقابل رسم).",

/* ---------- YOUR OWN NOTES (per place) ----------
   Always saved to this browser first (instant, works offline). If a GitHub token is connected
   (same one used for 📷 Photos — see ghConfig()), edited notes also sync to notes.json in the
   repo, so they follow you to any device instead of being stuck on this one. Only the keys you
   actually changed on THIS device get pushed — merged into whatever's already there — so two
   devices editing different places' notes never clobber each other. */
let USER_NOTES = {};
try{ USER_NOTES = JSON.parse(localStorage.getItem('ctgr_usernotes') || '{}') || {}; }catch(e){}
let notesDirty = new Set();
try{ notesDirty = new Set(JSON.parse(localStorage.getItem('ctgr_notes_dirty') || '[]')); }catch(e){}
const saveNotesLocal = ()=>{ try{ localStorage.setItem('ctgr_usernotes', JSON.stringify(USER_NOTES)); }catch(e){} };
const saveNotesDirty = ()=>{ try{ localStorage.setItem('ctgr_notes_dirty', JSON.stringify([...notesDirty])); }catch(e){} };
function saveUserNote(key, val){
  val = (val || '').trim();
  if(val) USER_NOTES[key] = val; else delete USER_NOTES[key];
  saveNotesLocal();
  notesDirty.add(key); saveNotesDirty();
  if(ghConfig()) scheduleNotesSync();
}
let notesSyncTimer = null, notesSyncBusy = false, notesSyncFails = 0;
function scheduleNotesSync(delay){
  if(notesSyncTimer) clearTimeout(notesSyncTimer);
  notesSyncTimer = setTimeout(syncNotesNow, delay != null ? delay : 2500);
}
const b64ToText = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,'')), c=>c.charCodeAt(0)));
async function syncNotesNow(){
  const cfg = ghConfig();
  if(!cfg || notesDirty.size === 0 || notesSyncBusy) return;
  notesSyncBusy = true;
  const myDirty = [...notesDirty];
  try{
    const branch = (await ghJson(cfg, '')).default_branch || 'main';
    let sha, remote = {};
    const r = await ghFetch(cfg, '/contents/notes.json?ref=' + encodeURIComponent(branch), {headers:{'Accept':'application/vnd.github+json'}});
    // NOTE: don't swallow a parse failure here into remote={} — that would make a hiccup reading
    // the existing file look like "there are no notes yet" and overwrite everyone else's synced
    // notes with just this device's. Let it throw, so the outer catch retries later instead.
    if(r.ok){ const d = await r.json(); sha = d.sha; remote = JSON.parse(b64ToText(d.content)) || {}; }
    else if(r.status !== 404){ throw Object.assign(new Error('GitHub ' + r.status), {status: r.status}); }
    // apply only what changed on THIS device on top of whatever's on GitHub right now
    myDirty.forEach(k=>{ if(USER_NOTES[k] != null) remote[k] = USER_NOTES[k]; else delete remote[k]; });
    const sorted = Object.fromEntries(Object.entries(remote).sort((a,b)=>a[0].localeCompare(b[0])));
    const content = await blobToB64(new Blob([JSON.stringify(sorted, null, 1)], {type:'application/json'}));
    await ghJson(cfg, '/contents/notes.json', {method:'PUT', body:{message:'Update notes', content, sha, branch}});
    myDirty.forEach(k=>notesDirty.delete(k)); saveNotesDirty();
    // this is now what's on GitHub: our overlaid changes + anything other devices added — but
    // keep whatever's currently typed locally for any key edited again while this sync was in
    // flight (still marked dirty), so a fast second edit is never silently reverted
    const stillDirty = {};
    notesDirty.forEach(k=>{ if(USER_NOTES[k] != null) stillDirty[k] = USER_NOTES[k]; });
    USER_NOTES = Object.assign({}, sorted, stillDirty);
    saveNotesLocal();
    renderAreas(); renderGardenRoute();
    notesSyncFails = 0;
  }catch(e){
    notesSyncFails++;
    scheduleNotesSync(Math.min(60000, 4000 * Math.pow(1.8, notesSyncFails)) + Math.random() * 1000);
  }finally{
    notesSyncBusy = false;
    if(notesDirty.size) scheduleNotesSync(2000);
  }
}
async function loadNotes(){
  try{
    const r = await fetch('notes.json?v=' + Date.now(), {cache:'no-store'});
    if(r.ok){
      const remote = await r.json() || {};
      Object.entries(remote).forEach(([k, v])=>{ if(!notesDirty.has(k)) USER_NOTES[k] = v; });
      saveNotesLocal();
    }
  }catch(e){}
  if(ghConfig() && notesDirty.size) scheduleNotesSync(1000);
}

/* ================= PHOTOS =================
   Two sources of photos per place:
   1. Published: files in the /photos folder listed in photos/manifest.json (everyone sees these).
   2. On this device: added in the browser and stored in IndexedDB (only this browser sees these).
   A place can hold up to MAX_SLOTS photos. */
const MAX_SLOTS = 6;
const PHOTO_MAX_SIDE = 2000;   // longest edge (px) of a saved photo
const PHOTO_QUALITY = 0.85;    // JPEG quality
const photoData = {};          // "idx:slot" -> {url, blob}   (this device)
const sharedPhotos = {};       // "idx:slot" -> url            (published)
let sharedManifest = {};
const slideState = {};         // base -> slide index shown on the card
let pendingMap = {};           // key -> filename: uploaded to GitHub, waiting for the site to rebuild
try{ pendingMap = JSON.parse(localStorage.getItem('ctgr_pending') || '{}') || {}; }catch(e){ pendingMap = {}; }
const savePending = ()=>{ try{ localStorage.setItem('ctgr_pending', JSON.stringify(pendingMap)); }catch(e){} };
let pendingRemoves = new Set();   // keys asked to be deleted from GitHub, still waiting to go through
try{ pendingRemoves = new Set(JSON.parse(localStorage.getItem('ctgr_pending_del') || '[]')); }catch(e){ pendingRemoves = new Set(); }
const savePendingRemoves = ()=>{ try{ localStorage.setItem('ctgr_pending_del', JSON.stringify([...pendingRemoves])); }catch(e){} };

const escHtml = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function itemForBase(base){
  base = String(base);
  if(base.startsWith('gr-')){
    let n = +base.slice(3);
    for(const t of GARDEN_ROUTE){ if(n < t.items.length) return t.items[n]; n -= t.items.length; }
    return null;
  }
  return PLACES[+base] || null;
}
function nameForBase(base){
  const it = itemForBase(base);
  return it ? (LANG==='ar' ? (it.n_ar || it.n) : it.n) : '';
}
const noThumb = new Set();     // published files that have no small version yet
const thumbUrl = f=>(noThumb.has(f) ? 'photos/' : 'photos/t/') + encodeURIComponent(f);
const canEdit = ()=>!!ghConfig();   // only devices connected with your GitHub token can add / replace / delete
function photosFor(base){
  const out = [];
  for(let s=0; s<MAX_SLOTS; s++){
    const key = base+':'+s;
    if(photoData[key]) out.push({slot:s, key, url:photoData[key].url, thumb:photoData[key].url, local:true, pending:!!pendingMap[key]});
    else if(sharedPhotos[key]) out.push({slot:s, key, url:sharedPhotos[key], thumb:thumbUrl(sharedManifest[key]), local:false});
  }
  return out;
}
function makeThumbBlob(blob){
  return new Promise((resolve, reject)=>{
    const src = URL.createObjectURL(blob), img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth*k)); c.height = Math.max(1, Math.round(img.naturalHeight*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob(b=>b ? resolve(b) : reject(new Error('thumb failed')), 'image/jpeg', 0.78);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(src); reject(new Error('thumb decode failed')); };
    img.src = src;
  });
}

/* ---- saving a photo: resize + re-encode as JPEG ---- */
function processImage(file){
  return new Promise((resolve, reject)=>{
    const src = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(src);
      c.toBlob(b=> b ? resolve(b) : reject(new Error('encode failed')), 'image/jpeg', PHOTO_QUALITY);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(src); reject(new Error('decode failed')); };
    img.src = src;
  });
}

let toastTimer;

async function savePhotos(base, files, replaceSlot){
  if(!canEdit()){ toast(tr('needToken')); return; }
  let slots = [];
  if(replaceSlot != null){ slots = [replaceSlot]; files = files.slice(0,1); }
  else{
    const used = new Set(photosFor(base).map(p=>p.slot));
    for(let s=0; s<MAX_SLOTS && slots.length<files.length; s++) if(!used.has(s)) slots.push(s);
    if(!slots.length){ toast(tr('photoLimit').replace('{n}', MAX_SLOTS)); return; }
    if(slots.length < files.length) toast(tr('photoLimit').replace('{n}', MAX_SLOTS));
  }
  if(files.length > 1 || replaceSlot != null) toast(tr('photoSaving'));
  let firstSlot = null, failed = 0;
  const saved = [], stamp = Date.now().toString(36);
  for(let n=0; n<slots.length; n++){
    const key = base+':'+slots[n];
    try{
      const blob = await processImage(files[n]);
      if(photoData[key]) URL.revokeObjectURL(photoData[key].url);
      const thumb = await makeThumbBlob(blob).catch(()=>null);
      const filename = key.replace(':','_') + '-' + stamp + '.jpg';
      photoData[key] = {url: URL.createObjectURL(blob), blob, thumb, filename};
      delete pendingMap[key];
      await photoDB.put(key, blob);
      saved.push({key});
      if(firstSlot === null) firstSlot = slots[n];
    }catch(err){ console.error('Photo failed', err); failed++; }
  }
  savePending();
  if(failed) toast(tr('photoFail'));
  if(firstSlot === null) return;
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const idx = Math.max(0, photosFor(base).findIndex(p=>p.slot===firstSlot));
  slideState[base] = idx;
  refreshSlideshow(base);
  if(lbOpen() && lb.base === base) lbShow(idx);
  if(ghConfig()) scheduleUpload();
  else if(!failed) toast(tr('ghHint'));
}

/* ---- Upload queue --------------------------------------------------------
   Adding several photos quickly (common on a phone) used to fire one GitHub
   commit per photo at the same time; those commits raced each other and the
   losers were silently dropped. Everything below batches whatever hasn't been
   uploaded yet into ONE commit at a time (never two at once), retries on
   failure, and picks back up automatically next time the page is open  —
   including a photo whose upload was cut short by the phone locking or the
   tab going to the background mid-request. */
// A single FIFO chain: uploads, replaces and deletes all funnel through here, one at a time.
// This is what stops "Update is not a fast forward" errors — that error means two
// GitHub commits were attempted at the same moment (e.g. adding one photo while
// removing another); queuing them one after another instead of side by side removes the race.
let ghChain = Promise.resolve();
function ghSerial(task){
  const run = ghChain.then(task, task);
  ghChain = run.catch(()=>{});
  return run;
}
let uploadTimer = null, uploadFails = 0, uploadState = 'idle';   // 'idle' | 'uploading' | 'retrying'
function scheduleUpload(delay){
  clearTimeout(uploadTimer);
  uploadTimer = setTimeout(()=>ghSerial(uploadQueued), delay == null ? 2500 : delay);
}
function pendingUploadBases(){
  return [...new Set(Object.keys(photoData).filter(k=>!pendingMap[k]).map(k=>k.split(':')[0]))];
}
function pendingUploadCount(){ return Object.keys(photoData).filter(k=>!pendingMap[k]).length + pendingRemoves.size; }
const UPLOAD_CHUNK = 10;   // photos per commit — a big batch is sent in small steps instead of one giant one,
                            // so most of it is safely saved even if something interrupts partway through
let uploadTotal = 0, uploadDone = 0;
// filename/thumb only ever live in memory (photoData) — if the page reloads while a photo is
// still waiting to upload, IndexedDB still has the raw picture, but not those two fields. This
// fills them back in before anything is sent, so a lost filename never becomes the literal text
// "undefined" (which used to make every such photo silently overwrite the same broken file).
async function ensureUploadMeta(key, v){
  if(!v.filename){
    v.filename = key.replace(':','_') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6) + '.jpg';
  }
  if(!v.thumb){
    v.thumb = await makeThumbBlob(v.blob).catch(()=>null);
  }
  return v;
}
async function uploadQueued(){
  const cfg = ghConfig(); if(!cfg) return;
  const pendingKeys = Object.keys(photoData).filter(k=>!pendingMap[k]);
  await Promise.all(pendingKeys.map(k=>ensureUploadMeta(k, photoData[k])));
  let adds = pendingKeys.map(key=>{ const v = photoData[key]; return {key, blob:v.blob, thumb:v.thumb, filename:v.filename}; });
  let removeKeys = [...pendingRemoves];
  if(!adds.length && !removeKeys.length){ uploadState = 'idle'; uploadFails = 0; uploadTotal = 0; uploadDone = 0; return; }
  uploadTotal = adds.length + removeKeys.length; uploadDone = 0;
  uploadState = 'uploading'; refreshUploadStatus();
  const touchedBases = new Set();
  while(adds.length || removeKeys.length){
    const chunkAdds = adds.splice(0, UPLOAD_CHUNK);
    const chunkRemoves = removeKeys; removeKeys = [];   // deletes are cheap (no file upload) — clear them all in the first chunk
    const n = chunkAdds.length + chunkRemoves.length;
    toast(uploadTotal > n ? tr('ghUploadingProgress').replace('{a}', uploadDone).replace('{b}', uploadTotal) : (n > 1 ? tr('ghUploadingN').replace('{n}', n) : tr('ghUploading')));
    try{
      await ghCommit(cfg, {adds: chunkAdds, removeKeys: chunkRemoves, message: 'Update ' + n + ' photo' + (n === 1 ? '' : 's')});
      chunkAdds.forEach(a=>{ pendingMap[a.key] = a.filename; touchedBases.add(a.key.split(':')[0]); });
      chunkRemoves.forEach(k=>{ pendingRemoves.delete(k); delete sharedPhotos[k]; touchedBases.add(k.split(':')[0]); });
      savePending(); savePendingRemoves();
      uploadDone += n;
      touchedBases.forEach(b=>{ refreshSlideshow(b); if(lbOpen() && b === lb.base) lbShow(lb.i); });
      uploadFails = 0; refreshUploadStatus();
    }catch(err){
      console.error('GitHub upload failed', err);
      toast(ghErrText(err));
      uploadFails++; uploadState = 'retrying';
      // whatever uploaded before this point is already safely committed on GitHub — only what's left
      // (this chunk onward) still needs to go, and that's what the next attempt will pick up
      scheduleUpload(Math.min(60000, 4000 * Math.pow(1.8, uploadFails - 1)) + Math.random() * 1000);
      refreshUploadStatus();
      return;
    }
  }
  toast(tr('ghDone'));
  uploadState = 'idle'; uploadFails = 0; uploadTotal = 0; uploadDone = 0;
  refreshUploadStatus();
}
function refreshUploadStatus(){
  const el = document.getElementById('ppUploadStatus'); if(!el) return;
  const n = pendingUploadCount();
  el.textContent = uploadState === 'uploading' ? (uploadTotal > 1 ? tr('ghQueueProgress').replace('{a}', uploadDone).replace('{b}', uploadTotal) : tr('ghQueueBusy'))
    : uploadState === 'retrying' ? tr('ghQueueRetry').replace('{n}', n)
    : n ? tr('ghQueueWaiting').replace('{n}', n) : '';
}

/* zoom + pan */
function applyT(){
  lbImg.style.transform = `translate(${lb.tx}px,${lb.ty}px) scale(${lb.s})`;
  lbStage.classList.toggle('zoomed', lb.s > 1.01);
}
function clampT(){
  const mx = Math.max(0, (lbImg.offsetWidth*lb.s - lbStage.clientWidth)/2);
  const my = Math.max(0, (lbImg.offsetHeight*lb.s - lbStage.clientHeight)/2);
  lb.tx = Math.min(mx, Math.max(-mx, lb.tx)); lb.ty = Math.min(my, Math.max(-my, lb.ty));
}
function zoomAt(ns, cx, cy){
  ns = Math.min(8, Math.max(1, ns));
  const k = ns / lb.s;
  lb.tx = cx - (cx - lb.tx)*k; lb.ty = cy - (cy - lb.ty)*k; lb.s = ns;
  if(ns <= 1.001){ lb.s = 1; lb.tx = 0; lb.ty = 0; }
  clampT(); applyT();
}
function toggleZoom(e){
  if(lb.s > 1.01){ zoomAt(1,0,0); return; }
  const r = lbStage.getBoundingClientRect();
  const actual = lbImg.naturalWidth / Math.max(1, lbImg.offsetWidth);   // 100% pixel size
  zoomAt(Math.min(8, Math.max(2, actual)), e.clientX - r.left - r.width/2, e.clientY - r.top - r.height/2);
}
lbStage.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = lbStage.getBoundingClientRect();
  zoomAt(lb.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left - r.width/2, e.clientY - r.top - r.height/2);
}, {passive:false});

const ptrs = new Map(); let pan = null, pinch = null, downOnImg = false, lastTap = 0;
const ptrDist = ()=>{ const [a,b] = [...ptrs.values()]; return Math.hypot(a.x-b.x, a.y-b.y); };
lbStage.addEventListener('pointerdown', e=>{
  try{ lbStage.setPointerCapture(e.pointerId); }catch(err){}
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 1){ pan = {x:e.clientX, y:e.clientY, tx:lb.tx, ty:lb.ty, moved:false}; downOnImg = (e.target === lbImg); }
  else if(ptrs.size === 2){ pinch = {d:ptrDist(), s:lb.s}; pan = null; }
});
lbStage.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 2 && pinch){
    const r = lbStage.getBoundingClientRect(), [a,b] = [...ptrs.values()];
    zoomAt(pinch.s * ptrDist() / pinch.d, (a.x+b.x)/2 - r.left - r.width/2, (a.y+b.y)/2 - r.top - r.height/2);
  }else if(pan){
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if(Math.abs(dx)+Math.abs(dy) > 6) pan.moved = true;
    if(lb.s > 1.01){ lb.tx = pan.tx + dx; lb.ty = pan.ty + dy; clampT(); applyT(); lbStage.classList.add('dragging'); }
  }
});
function endPointer(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); lbStage.classList.remove('dragging');
  if(ptrs.size < 2) pinch = null;
  if(pan && ptrs.size === 0 && e.type === 'pointerup'){
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if(lb.s <= 1.01 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.4) lbShow(lb.i + (dx<0 ? 1 : -1));
    else if(!pan.moved){
      if(!downOnImg) closeLightbox();
      else{ const now = Date.now(); if(now - lastTap < 320){ toggleZoom(e); lastTap = 0; } else lastTap = now; }
    }
  }
  if(ptrs.size === 0) pan = null;
}
lbStage.addEventListener('pointerup', endPointer);
lbStage.addEventListener('pointercancel', endPointer);

const crcTable = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i=0;i<buf.length;i++) c = crcTable[(c ^ buf[i]) & 255] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function makeZip(files){   // files: [{name, data:Uint8Array}] -> Blob (stored, no compression; JPEGs are already compressed)
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,size,true);
    lh.setUint32(22,size,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((a,c)=>a+c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}
async function exportPhotos(){
  const keys = Object.keys(photoData);
  if(!keys.length){ toast(tr('ppNone')); return; }
  const stamp = Date.now().toString(36), manifest = Object.assign({}, sharedManifest), files = [];
  for(const k of keys){
    const name = k.replace(':','_') + '-' + stamp + '.jpg';
    manifest[k] = name;
    files.push({name:'photos/'+name, data:new Uint8Array(await photoData[k].blob.arrayBuffer())});
  }
  files.push({name:'photos/manifest.json', data:new TextEncoder().encode(JSON.stringify(manifest, null, 1))});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(makeZip(files)); a.download = 'trip-photos.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ---- GitHub sync (saves photos into your repo so every device sees them) ---- */
function ghConfig(){ try{ const c = JSON.parse(localStorage.getItem('ctgr_gh') || 'null'); return (c && c.token && c.owner && c.repo) ? c : null; }catch(e){ return null; } }
function ghSaveConfig(c){ try{ if(c) localStorage.setItem('ctgr_gh', JSON.stringify(c)); else localStorage.removeItem('ctgr_gh'); }catch(e){} }
function ghGuess(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i), seg = location.pathname.split('/').filter(Boolean)[0] || '';
  return {owner: m ? m[1] : '', repo: (m && seg && !/\.html?$/i.test(seg)) ? seg : ''};
}
async function ghFetch(cfg, path, opt){
  opt = opt || {};
  // GitHub's API sends its own Cache-Control headers on GET responses (e.g. the ref/commit/contents
  // lookups below), and the browser will honour those by default — silently serving a stale, cached
  // answer instead of asking GitHub again. Since every commit here depends on reading the repo's
  // CURRENT state first, a stale read means we keep building on top of an outdated ref, which GitHub
  // then rejects as "not a fast-forward" — forever, since the next attempt reads the same stale cache.
  // cache:'no-store' forces a real network request every time, so we always see the true current state.
  return fetch('https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + path, {
    method: opt.method || 'GET',
    cache: 'no-store',
    headers: Object.assign({'Authorization':'Bearer ' + cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
}
async function ghJson(cfg, path, opt){
  const r = await ghFetch(cfg, path, opt);
  if(!r.ok){ const e = new Error('GitHub ' + r.status); e.status = r.status; try{ e.detail = (await r.json()).message; }catch(_){} throw e; }
  return r.json();
}
function ghErrText(err){
  if(err && err.status === 401) return tr('ghBadToken');
  if(err && err.status === 403) return tr('ghNoAccess');
  if(err && err.status === 404) return tr('ghNotFound');
  return tr('ghFail').replace('{e}', (err && (err.detail || err.message)) || '?');
}
const blobToB64 = b => new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(String(fr.result).split(',')[1]); fr.onerror = ()=>rej(fr.error); fr.readAsDataURL(b); });

// One commit that adds/replaces/removes photos and rewrites photos/manifest.json
async function ghCommit(cfg, {adds = [], removeKeys = [], extra = [], message}){
  // Belt-and-braces: a photo can never be written under a missing/blank filename — that's what
  // silently overwrote a single "photos/undefined" file over and over in the past. If this ever
  // fires it means a caller forgot to run it through the upload queue's own safety check.
  for(const a of adds){ if(!a.filename || typeof a.filename !== 'string'){ throw new Error('Refusing to upload a photo with no filename (key: ' + a.key + ')'); } }
  let lastErr;
  for(let attempt = 0; attempt < 5; attempt++){
    if(attempt > 0) await new Promise(res=>setTimeout(res, 400 * attempt + Math.random() * 400));
    try{
      const branch = (await ghJson(cfg, '')).default_branch || 'main';
      const head = (await ghJson(cfg, '/git/ref/heads/' + branch)).object.sha;
      const baseTree = (await ghJson(cfg, '/git/commits/' + head)).tree.sha;
      let manifest = {};
      const mr = await ghFetch(cfg, '/contents/photos/manifest.json?ref=' + encodeURIComponent(branch), {headers:{'Accept':'application/vnd.github.raw+json'}});
      if(mr.ok){ try{ manifest = JSON.parse(await mr.text()) || {}; }catch(e){ manifest = {}; } }
      else if(mr.status !== 404){ const e = new Error('GitHub ' + mr.status); e.status = mr.status; throw e; }
      const tree = [], deletes = [];
      for(const a of adds){
        if(!a.sha) a.sha = (await ghJson(cfg, '/git/blobs', {method:'POST', body:{content: await blobToB64(a.blob), encoding:'base64'}})).sha;
        tree.push({path:'photos/' + a.filename, mode:'100644', type:'blob', sha:a.sha});
        if(a.thumb){
          if(!a.tsha) a.tsha = (await ghJson(cfg, '/git/blobs', {method:'POST', body:{content: await blobToB64(a.thumb), encoding:'base64'}})).sha;
          tree.push({path:'photos/t/' + a.filename, mode:'100644', type:'blob', sha:a.tsha});
        }
        if(manifest[a.key] && manifest[a.key] !== a.filename){ deletes.push('photos/' + manifest[a.key], 'photos/t/' + manifest[a.key]); }
        manifest[a.key] = a.filename;
      }
      for(const x of extra){
        if(!x.sha) x.sha = (await ghJson(cfg, '/git/blobs', {method:'POST', body:{content: await blobToB64(x.blob), encoding:'base64'}})).sha;
        tree.push({path:x.path, mode:'100644', type:'blob', sha:x.sha});
      }
      removeKeys.forEach(k=>{ if(manifest[k]){ deletes.push('photos/' + manifest[k], 'photos/t/' + manifest[k]); delete manifest[k]; } });
      const sorted = Object.fromEntries(Object.entries(manifest).sort((x,y)=>x[0].localeCompare(y[0], undefined, {numeric:true})));
      tree.push({path:'photos/manifest.json', mode:'100644', type:'blob', content: JSON.stringify(sorted, null, 1)});
      const mkTree = extra => ghJson(cfg, '/git/trees', {method:'POST', body:{base_tree: baseTree, tree: tree.concat(extra.map(p=>({path:p, mode:'100644', type:'blob', sha:null})))}});
      let t;
      try{ t = await mkTree(deletes); }
      catch(e){
        if(!(e.status === 422 && deletes.length)) throw e;            // an old file (or its small version) was already gone
        try{ t = await mkTree(deletes.filter(p=>!p.startsWith('photos/t/'))); }
        catch(e2){ if(e2.status === 422) t = await mkTree([]); else throw e2; }
      }
      const c = await ghJson(cfg, '/git/commits', {method:'POST', body:{message: message || 'Update photos', tree: t.sha, parents:[head]}});
      await ghJson(cfg, '/git/refs/heads/' + branch, {method:'PATCH', body:{sha: c.sha}});
      sharedManifest = sorted;
      return sorted;
    }catch(e){ lastErr = e; if(!(e.status === 422 || e.status === 409)) break; }   // 422/409 = someone (another device, or our own retry) committed meanwhile: retry with the new head
  }
  throw lastErr;
}

async function loadManifest(){
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const r = await fetch('photos/manifest.json?v=' + Date.now(), {cache:'no-store'});
      if(r.ok){
        sharedManifest = (await r.json()) || {};
        Object.keys(sharedPhotos).forEach(k=>delete sharedPhotos[k]);
        Object.entries(sharedManifest).forEach(([k,f])=>{ sharedPhotos[k] = 'photos/' + encodeURIComponent(f); });
      }
      return;      // loaded, or there is no manifest yet
    }catch(e){ await new Promise(res=>setTimeout(res, 1500)); }   // network hiccup: try once more
  }
}
const withTimeout = (p, ms, dflt)=>Promise.race([p, new Promise(res=>setTimeout(()=>res(dflt), ms))]);
const isRealFilename = f => typeof f === 'string' && /\.(jpe?g|png)$/i.test(f);
async function loadPhotos(){
  await loadManifest();
  renderAreas(); renderGardenRoute();      // published photos appear straight away
  try{
    const all = await withTimeout(photoDB.all(), 4000, {});
    Object.entries(all).forEach(([k,b])=>{ if(!photoData[k]) photoData[k] = {url:URL.createObjectURL(b), blob:b}; });
  }catch(e){}
  // A past bug could mark a photo "uploaded" under a broken filename (literally the text
  // "undefined") without it ever really being saved. Treat any such entry as still-pending —
  // never as a match to delete the local original over — so it gets re-uploaded properly instead.
  let repaired = false;
  for(const k of Object.keys(pendingMap)){
    if(!isRealFilename(pendingMap[k])){ delete pendingMap[k]; repaired = true; }
  }
  if(repaired) savePending();
  // photos uploaded to GitHub earlier: once the site's own manifest has them, drop the temporary local copy
  let changed = false;
  for(const [k,f] of Object.entries(pendingMap)){
    if(isRealFilename(f) && sharedManifest[k] === f){
      delete pendingMap[k]; changed = true;
      if(photoData[k]){ URL.revokeObjectURL(photoData[k].url); delete photoData[k]; await photoDB.del(k); }
    }
  }
  if(changed) savePending();
  renderAreas(); renderGardenRoute();
  if(ghConfig() && (pendingUploadBases().length || pendingRemoves.size)) scheduleUpload(1500);
}
