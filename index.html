function grItemCard(item, grIdx){
  const name = LANG==='ar' ? item.n_ar : item.n;
  const about = LANG==='ar' ? item.about_ar : item.about;
  const mynote = LANG==='ar' ? item.mynote_ar : item.mynote;
  const catColors = {activity:"#1f5f6b",restaurant:"#e2622e",coffee:"#8a4fae",shop:"#c9942f"};
  const color = catColors[item.c] || "#6f8c5f";
  const isPicked = grPicked.has(grIdx);
  return `<div class="gr-card ${isPicked?'picked':''}">
    ${slideshow('gr-'+grIdx)}
    <div class="gr-card-body">
    <div class="card-top"><h4>${name}</h4><button class="pick-btn" data-grpick="${grIdx}" title="pick">${isPicked?'♥':'○'}</button></div>
    <div class="pill-row">
      <span class="catpill" style="background:${color}22;color:${color};">${CATS[LANG][item.c]?.label || item.c}</span>
      ${item.rating ? `<span class="rating-pill">★ ${item.rating.toFixed(1)} <i>(${item.ratingCount.toLocaleString()})</i></span>` : ``}
      <span class="price-pill">${item.price ? money(item.price) : tr('freeLabel')}</span>
      ${item.weak ? `<span class="weak-pill" title="${tr('weakSignalTip')}">📶 ${tr('weakSignal')}</span>` : ``}
    </div>
    <p class="about">${about||''}</p>
    ${mynote ? `<div class="mynote">📝 ${mynote}</div>` : ``}
    ${unoteBlock('g:'+item.n)}
    <div class="gr-card-actions">
      <a class="mini-link primary" href="${item.g}" target="_blank">📍 ${tr('directions')}</a>
      ${(item.c==='restaurant'||item.c==='coffee') ? `<a class="mini-link" href="${item.menu||gsearch(item.n+' Garden Route menu')}" target="_blank">📋 ${tr('menuBtn')}</a>` : ``}
      ${item.book ? `<a class="mini-link" href="${item.link}" target="_blank">🎟 ${LANG==='ar'?'الحجز':'Book'}</a>` : ``}
      ${item.phone ? `<a class="mini-link" href="tel:${item.phone.replace(/\s/g,'')}">📞 ${item.phone}</a>` : ``}
    </div>
    </div>
  </div>`;
}

    table += `<tr><td><b>${name}</b></td><td>${loc}</td><td><div class="saf-big5">${bigFivePills(s)}</div></td><td>${ratingTxt}</td><td>${price}</td></tr>`;
  });
  table += `</tbody></table></div>`;

  let cards = '';
  SAFARI.forEach(s=>{
    const name = LANG==='ar'?s.n_ar:s.n;
    const about = LANG==='ar'?s.about_ar:s.about;
    const includes = LANG==='ar'?s.includes_ar:s.includes;
    const price = LANG==='ar'?s.price_ar:s.price;
    const mynote = LANG==='ar'?s.mynote_ar:s.mynote;
    const steps = LANG==='ar'?s.steps_ar:s.steps;
    cards += `<div class="saf-card">
      <div class="saf-card-head"><h3>${name}</h3><span class="saf-price-tag">${price}</span></div>
      <div class="pill-row">
        <div class="saf-big5">${bigFivePills(s)}</div>
        ${s.rating ? `<span class="rating-pill">★ ${s.rating.toFixed(1)} <i>(${s.ratingCount.toLocaleString()})</i></span>` : ``}
      </div>
      <p class="about">${about}</p>
      <p class="about"><b>${LANG==='ar'?'يشمل':'Includes'}:</b> ${includes}</p>
      ${mynote ? `<div class="mynote saf-mynote">📝 ${mynote}</div>` : ``}
      <div class="card-actions">
        <a class="mini-link primary" href="${s.g}" target="_blank">📍 ${tr('directions')}</a>
        <a class="mini-link verified" href="${s.site}" target="_blank">🌐 ${LANG==='ar'?'الموقع الرسمي':'Official site'}</a>
      </div>
      <button type="button" class="steps-toggle" data-safstep="${SAFARI.indexOf(s)}" style="margin-top:10px;">${tr('howToBook')} ▸</button>
      <div class="steps" id="safsteps-${SAFARI.indexOf(s)}">
        <ol>${steps.map(st=>`<li>${st}</li>`).join('')}</ol>
      </div>
    </div>`;
  });

  el.innerHTML = table + cards;
  el.querySelectorAll('[data-safstep]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const stepsEl = document.getElementById('safsteps-'+btn.dataset.safstep);
      stepsEl.classList.toggle('open');
      btn.textContent = (stepsEl.classList.contains('open')?tr('howToBook')+' ▾':tr('howToBook')+' ▸');
    });
  });
}

function renderGardenRoute(){
  const el = document.getElementById('grContent');
  let total = 0;
  let grIdx = 0;
  let html = '';
  GARDEN_ROUTE.forEach(t=>{
    total += t.items.length;
    const name = LANG==='ar' ? t.town_ar : t.town;
    html += `<div class="gr-town"><div class="gr-town-head"><span class="gr-pin">${t.pin}</span><h3>${name}</h3><span class="count" style="margin-inline-start:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#8a7f70;">${t.items.length}</span></div><div class="gr-grid">`;
    t.items.forEach(item=>{ html += grItemCard(item, grIdx); grIdx++; });
    html += `</div></div>`;
  });
  el.innerHTML = html;
  const countEl = document.getElementById('grCount');
  if(countEl) countEl.textContent = total;
  wireGRCardEvents(el);
}
function wireGRCardEvents(container){
  container.querySelectorAll('[data-grpick]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx=+btn.dataset.grpick;
      if(grPicked.has(idx)) grPicked.delete(idx); else grPicked.add(idx);
      renderGardenRoute(); renderDrawer(); updateBudget();
    });
  });
  wireNoteEvents(container);
}

function grItinChip(name){

  const catColors = {activity:"#1f5f6b",restaurant:"#e2622e",coffee:"#8a4fae",shop:"#c9942f"};
  const color = catColors[item.c] || "#6f8c5f";
  const label = LANG==='ar' ? item.n_ar : item.n;
  return `<a class="itin-chip" href="${item.g}" target="_blank"><span class="ic-dot" style="background:${color}"></span>${label}${item.rating?`<span class="ic-star">★${item.rating.toFixed(1)}</span>`:''}${item.book?`<span class="ic-book">●</span>`:''}</a>`;
}

function unifiedChip(ref){
  if(!ref) return '';
  if(typeof ref === 'object'){
    const label = LANG==='ar' ? (ref.n_ar||ref.n) : ref.n;
    const color = ref.hotel ? "#8a4fae" : (ref.color || "#6f8c5f");
    const icon = ref.hotel ? '🏨 ' : '';
    return `<a class="itin-chip ${ref.hotel?'itin-chip-hotel':''}" href="${ref.g}" target="_blank">${icon}<span class="ic-dot" style="background:${color}"></span>${label}${ref.rating?`<span class="ic-star">★${ref.rating.toFixed(1)}</span>`:''}</a>`;
  }
  const name = ref;
  let item = PLACES.find(p=>p.n===name);
  let cat = item ? item.c : null;
  let g = item ? item.g : null;
  let rating = item ? item.rating : null;
  let ratingCount = item ? item.ratingCount : null;
  let book = item ? item.book : null;
  let label = item ? (LANG==='ar'?item.n_ar:item.n) : null;
  if(!item){
    const grItem = GARDEN_ROUTE.flatMap(t=>t.items).find(i=>i.n===name);
    if(grItem){ item=grItem; cat=grItem.c; g=grItem.g; rating=grItem.rating; ratingCount=grItem.ratingCount; book=grItem.book; label=LANG==='ar'?grItem.n_ar:grItem.n; }
  }
  if(!item){
    const safItem = SAFARI.find(s=>s.n===name);
    if(safItem){ item=safItem; cat='activity'; g=safItem.g; rating=safItem.rating; ratingCount=safItem.ratingCount; book=false; label=LANG==='ar'?safItem.n_ar:safItem.n; }
  }
  if(!item) return `<span class="itin-chip" style="opacity:.6;">${name}</span>`;
  const catColors = {activity:"#1f5f6b",restaurant:"#e2622e",coffee:"#8a4fae",shop:"#c9942f",icecream:"#2f9e8f",market:"#6f8c5f",sim:"#5c6f52"};
  const color = catColors[cat] || "#6f8c5f";
  return `<a class="itin-chip" href="${g}" target="_blank"><span class="ic-dot" style="background:${color}"></span>${label}${rating?`<span class="ic-star">★${rating.toFixed(1)}</span>`:''}${book?`<span class="ic-book">●</span>`:''}</a>`;
}
function renderPlanItinerary(){
  const el = document.getElementById('planItinerary');
  if(!el) return;
  let html = '';
  ITINERARY14.forEach((day,i)=>{
    const title = LANG==='ar' ? day.title_ar : day.title;
    const tip = LANG==='ar' ? day.tip_ar : day.tip;
    const dayLabel = LANG==='ar' ? `اليوم ${i+1}` : `Day ${i+1}`;
    html += `<div class="day-card"><div class="day-head"><span class="day-num">${dayLabel}</span><h3>${title}</h3><div class="day-head-right">${day.date?`<span class="day-date">${day.date}</span>`:''}<button type="button" class="day-cal-btn" data-icsday="${i}" aria-label="${tr('icsDayBtn')}" title="${tr('icsDayBtn')}">📅</button></div></div><p class="day-tip">${tip}</p>`;
    if(day.hotel){
      const h = day.hotel;
      const hname = LANG==='ar' ? (h.n_ar||h.n) : h.n;
      html += `<div class="hotel-box"><span class="hotel-ic">🏨</span><div><b>${hname}</b><div class="hotel-meta">${h.rating?`★ ${h.rating.toFixed(1)} (${h.ratingCount.toLocaleString()}) · `:''}${LANG==='ar'?h.note_ar:h.note}</div></div><a class="mini-link primary" href="${h.g}" target="_blank">📍 ${tr('directions')}</a></div>`;
    }
    day.blocks.forEach(b=>{
      const slot = LANG==='ar' ? b.slot_ar : b.slot;
      const chips = b.items.map(unifiedChip).join('');
      html += `<div class="slot"><div class="slot-label">${slot}</div><div class="slot-items">${chips}</div></div>`;
    });
    html += `</div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-icsday]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); downloadTripICS(+btn.dataset.icsday); });
  });
}

/* ================= ITINERARY PDF =================
   Builds a clean, print-only document (#printDoc) from the 14-day plan (+ your shortlist),
   with up to 3 small photos per place, then opens the browser's print dialog ("Save as PDF"). */
const thumbData = new Map();       // photo url -> small JPEG data URL (keeps the PDF light)
const thumbJobs = new Map();
let pdfBusy = false;
const CAT_BY_COLOR = {'#e2622e':'restaurant','#8a4fae':'coffee','#1f5f6b':'activity','#c9942f':'shop','#2f9e8f':'icecream'};
const pt = (o,k)=> (LANG==='ar' ? (o[k+'_ar'] || o[k]) : o[k]) || '';
const BIG5_AR = {Elephant:'الفيل', Lion:'الأسد', Leopard:'النمر', Rhino:'وحيد القرن', Buffalo:'الجاموس'};

function clipText(s, n){
  s = String(s || ''); if(s.length <= n) return s;
  const cut = s.slice(0, n), dot = cut.lastIndexOf('. ');
  return dot > n*0.55 ? cut.slice(0, dot+1) : cut.replace(/\s+\S*$/, '') + '…';
}
const shortUrl = u => String(u||'').replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');

function makeThumb(url, small){
  if(thumbJobs.has(url)) return thumbJobs.get(url);
  const job = new Promise(resolve=>{
    const img = new Image(); let done = false, triedFull = !small || small === url;
    const finish = v=>{ if(done) return; done = true; if(v) thumbData.set(url, v); resolve(v); };
    setTimeout(()=>finish(null), 20000);
    img.onload = ()=>{
      try{
        const k = Math.min(1, 480 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth*k)); c.height = Math.max(1, Math.round(img.naturalHeight*k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        finish(c.toDataURL('image/jpeg', 0.75));
      }catch(e){ finish(null); }
    };
    img.onerror = ()=>{ if(!triedFull){ triedFull = true; img.src = url; } else finish(null); };
    img.src = triedFull ? url : small;
  });
  thumbJobs.set(url, job); return job;
}
async function runPool(list, limit, fn){
  let i = 0;
  await Promise.all(Array.from({length: Math.min(limit, list.length)}, async ()=>{ while(i < list.length){ const x = list[i++]; await fn(x); } }));
}

/* turn a name / custom pick / hotel into one uniform record */
function resolveRef(ref){
  if(!ref) return null;
  if(typeof ref === 'object'){
    if(ref.hotel) return {kind:'hotel', id:ref.n, name:pt(ref,'n'), g:ref.g, rating:ref.rating, ratingCount:ref.ratingCount, note:pt(ref,'note')};
    const cat = CAT_BY_COLOR[ref.color] || null;
    return {kind:'pick', id:ref.n, name:pt(ref,'n'), cat, g:ref.g, rating:ref.rating, ratingCount:ref.ratingCount, facts:[]};
  }
  const bookOf = (b, phone)=>{
    if(b && typeof b === 'object') return {bookFlag:true, bookNote:pt(b,'note'), steps:(LANG==='ar' ? (b.steps_ar||b.steps) : b.steps) || [], bookLink:b.link || ''};
    return {bookFlag:!!b, bookNote:'', steps:[], bookLink:''};
  };
  const idx = PLACES.findIndex(p=>p.n === ref);
  if(idx >= 0){
    const p = PLACES[idx];
    return Object.assign({kind:'place', id:p.n, base:String(idx), name:pt(p,'n'), cat:p.c, area:AREAS_META[p.a] ? AREAS_META[p.a][LANG] : '',
      about:clipText(pt(p,'about'), 380), cuisine:pt(p,'cuisine'), rating:p.rating, ratingCount:p.ratingCount, weak:p.weak, phone:p.phone||'', g:p.g, mynote:pt(p,'mynote'),
      priceText: p.price>0 ? money(p.price) : (p.c==='activity' ? tr('freeLabel') : ''),
      facts:[[tr('best'),pt(p,'best')],[tr('dur'),pt(p,'dur')],[tr('wear'),pt(p,'wear')]].filter(f=>f[1])}, bookOf(p.book));
  }
  let flatIdx = 0;
  for(const t of GARDEN_ROUTE){
    for(const it of t.items){
      if(it.n === ref){
        return Object.assign({kind:'gr', id:it.n, base:'gr-'+flatIdx, name:pt(it,'n'), cat:it.c, area:pt(t,'town'),
          about:clipText(pt(it,'about'), 380), rating:it.rating, ratingCount:it.ratingCount, weak:it.weak, g:it.g, mynote:pt(it,'mynote'),
          priceText: it.price>0 ? money(it.price) : (it.c==='activity' ? tr('freeLabel') : ''), facts:[]}, {bookFlag:!!it.book, bookNote:'', steps:[], bookLink:''});
      }
      flatIdx++;
    }
  }
  const s = SAFARI.find(x=>x.n === ref);
  if(s){
    const big5 = (s.big5||[]).map(b=>LANG==='ar' ? (BIG5_AR[b]||b) : b).join(LANG==='ar' ? '، ' : ', ');
    return {kind:'safari', id:s.n, name:pt(s,'n'), area:pt(s,'location'), about:clipText(pt(s,'about'), 380), rating:s.rating, ratingCount:s.ratingCount,
      g:s.g, mynote:pt(s,'mynote'), priceText:pt(s,'price'), bookFlag:false, steps:(LANG==='ar' ? (s.steps_ar||s.steps) : s.steps) || [], bookLink:s.site||'', bookNote:'',
      facts:[[LANG==='ar'?'يشمل':'Includes', pt(s,'includes')],[LANG==='ar'?'الخمسة الكبار':'Big Five here', big5]].filter(f=>f[1])};
  }
  return {kind:'text', id:String(ref), name:String(ref)};
}

function buildPrintModel(){
  const used = new Set(); let stay = null;
  const days = ITINERARY14.map((d, i)=>{
    if(d.hotel) stay = d.hotel;
    const blocks = d.blocks.map(b=>({label:pt(b,'slot'), items:b.items.map(r=>{ const it = resolveRef(r); if(it) used.add(it.id); return it; }).filter(Boolean)}));
    return {i, title:pt(d,'title'), tip:pt(d,'tip'), date:d.date||'', hotel:d.hotel ? resolveRef(d.hotel) : null, stay:(i === ITINERARY14.length-1) ? null : (stay ? resolveRef(stay) : null), blocks};
  });
  const groups = {}, already = [];
  const add = (label, it)=>{ if(!it) return; if(used.has(it.id)){ already.push(it.name); return; } (groups[label] = groups[label] || []).push(it); };
  [...picked].sort((a,b)=>a-b).forEach(i=>{ const p = PLACES[i]; if(p) add(AREAS_META[p.a] ? AREAS_META[p.a][LANG] : '', resolveRef(p.n)); });
  const grFlat = GARDEN_ROUTE.flatMap(t=>t.items.map(it=>({it, t})));
  [...grPicked].sort((a,b)=>a-b).forEach(i=>{ const x = grFlat[i]; if(x) add(pt(x.t,'town') + (LANG==='ar' ? ' (طريق الحدائق)' : ' (Garden Route)'), resolveRef(x.it.n)); });
  return {days, groups, already, budget:computeBudget()};
}

async function printItinerary(){
  if(pdfBusy) return; pdfBusy = true;
  try{
    const model = buildPrintModel();
    const bases = new Set();
    const collect = it=>{ if(it && it.base) bases.add(it.base); };
    model.days.forEach(d=>d.blocks.forEach(b=>b.items.forEach(collect)));
    Object.values(model.groups).forEach(arr=>arr.forEach(collect));
    const smallOf = new Map();
    [...bases].forEach(b=>photosFor(b).slice(0,3).forEach(p=>{ if(!thumbData.has(p.url)) smallOf.set(p.url, p.thumb); }));
    const urls = [...smallOf.keys()];
    let done = 0;
    if(urls.length){
      toast(tr('pdfPreparing').replace('{a}', 0).replace('{b}', urls.length));
      await runPool(urls, 4, async u=>{ await makeThumb(u, smallOf.get(u)); done++; toast(tr('pdfPreparing').replace('{a}', done).replace('{b}', urls.length)); });
    }
    const doc = document.getElementById('printDoc');
    doc.innerHTML = renderPrintDoc(model);
    await Promise.all([...doc.querySelectorAll('img')].map(i=>i.decode ? i.decode().catch(()=>{}) : null));
    document.body.classList.add('printing');
    const cleanup = ()=>{ document.body.classList.remove('printing'); window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup);
    setTimeout(cleanup, 180000);
    window.print();
  }catch(err){ console.error(err); toast(tr('pdfFail')); }
  finally{ pdfBusy = false; }
}

   - Live: current conditions + next 24 hours + next 16 days (refreshes every ~25 min).

const WX_LOC = {ct:{lat:-33.9249, lon:18.4241}, gr:{lat:-34.0361, lon:23.0487}};   // Cape Town, Knysna (Garden Route)
const TRIP_START = '2026-10-28', TRIP_DAYS = 14;

/* ---------- COUNTDOWN ---------- */
function isoPlusDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function updateCountdown(){
  const b = document.getElementById('statCountdown'), lbl = document.getElementById('countdownLabel');
  if(!b || !lbl) return;
  const todayIso = new Date().toISOString().slice(0, 10);
  const start = new Date(TRIP_START + 'T00:00:00'), today = new Date(todayIso + 'T00:00:00');
  const end = new Date(isoPlusDays(TRIP_START, TRIP_DAYS - 1) + 'T00:00:00');
  const daysTo = Math.round((start - today) / 864e5);
  if(daysTo > 0){
    b.textContent = daysTo.toLocaleString(LANG==='ar' ? 'ar' : 'en-US');
    lbl.textContent = tr('statCountdownDefault');
  } else if(today <= end){
    const dayNum = Math.round((today - start) / 864e5) + 1;
    b.textContent = dayNum + ' / ' + TRIP_DAYS;
    lbl.textContent = tr('statCountdownToday');
  } else {
    b.textContent = '🎉';
    lbl.textContent = tr('statCountdownDone');
  }
}

/* ---------- CALENDAR EXPORT (.ics) ---------- */
function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsFold(line){ // RFC5545: lines over 75 octets should be folded with a leading space
  const out = [];
  let rest = line;
  while(rest.length > 74){ out.push(rest.slice(0, 74)); rest = ' ' + rest.slice(74); }
  out.push(rest);
  return out.join('\r\n');
}
function buildICS(events){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cape Town Trip Planner//EN','CALSCALE:GREGORIAN'];
  events.forEach((e, i)=>{
    const start = e.date.replace(/-/g,''), end = isoPlusDays(e.date, 1).replace(/-/g,'');
    lines.push('BEGIN:VEVENT');
    lines.push('UID:ctgr-' + e.date + '-' + i + '@capetown-trip');
    lines.push('DTSTAMP:' + stamp);
    lines.push('DTSTART;VALUE=DATE:' + start);
    lines.push('DTEND;VALUE=DATE:' + end);
    lines.push(icsFold('SUMMARY:' + icsEscape(e.title)));
    if(e.description) lines.push(icsFold('DESCRIPTION:' + icsEscape(e.description)));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}
function downloadICS(filename, text){
  const blob = new Blob([text], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast(tr('icsAdded'));
}
function icsEventForDay(i){
  const day = ITINERARY14[i];
  const title = (LANG==='ar' ? day.title_ar : day.title) || '';
  const tip = (LANG==='ar' ? day.tip_ar : day.tip) || '';
  const items = day.blocks.map(b=>{
    const slot = LANG==='ar' ? b.slot_ar : b.slot;
    const names = b.items.map(ref=>{
      const it = typeof ref === 'object' ? ref : (typeof ref === 'string' ? {n:ref} : null);
      return it ? (LANG==='ar' ? (it.n_ar||it.n) : it.n) : String(ref);
    }).join(', ');
    return `${slot}: ${names}`;
  }).join('\n');
  return {date: isoPlusDays(TRIP_START, i), title: `Day ${i+1} — ${title}`, description: [tip, items].filter(Boolean).join('\n\n')};
}
function downloadTripICS(dayIndex){
  if(typeof dayIndex === 'number'){
    downloadICS(`cape-town-trip-day-${dayIndex+1}.ics`, buildICS([icsEventForDay(dayIndex)]));
  } else {
    downloadICS('cape-town-trip.ics', buildICS(ITINERARY14.map((_, i)=>icsEventForDay(i))));
  }
}

function wxKind(code, isDay, wind, forceWind){
  let k;
  if(code === 0 || code === 1) k = isDay ? 'sun' : 'moon';
  else if(code === 2) k = isDay ? 'partly' : 'partlyNight';
  else if(code === 3) k = 'cloud';
  else if(code === 45 || code === 48) k = 'fog';
  else if(code >= 51 && code <= 57) k = 'drizzle';
  else if((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) k = 'rain';
  else if((code >= 71 && code <= 77) || code === 85 || code === 86) k = 'snow';
  else if(code >= 95) k = 'storm';
  else k = 'cloud';
  if(wind >= forceWind && ['sun','moon','partly','partlyNight','cloud'].includes(k)) k = 'windy';
  return k;
}

/* ---- data ---- */
const wxAddDays = (iso, n)=>{ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const wxShiftYear = (iso, y)=>{ const [, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10); };
const wxIsoToday = ()=>new Date().toISOString().slice(0, 10);
async function wxJson(url){ const r = await fetch(url); if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
const wxUrl = (base, loc, extra)=>`${base}?latitude=${WX_LOC[loc].lat}&longitude=${WX_LOC[loc].lon}&wind_speed_unit=kmh&timezone=Africa%2FJohannesburg${extra}`;
const WX_FDAILY = 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,sunrise,sunset,uv_index_max';
const WX_ADAILY = 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,sunrise,sunset';

/* small cache: memory + localStorage. If a request fails, the last saved answer is used (works offline). */
const wxMem = new Map();
function wxLsRead(){ try{ return JSON.parse(localStorage.getItem(WX_LS) || '{}') || {}; }catch(e){ return {}; } }
function wxLsWrite(o){
  try{
    const keys = Object.keys(o);
    if(keys.length > 40) keys.sort((a, b)=>o[a].t - o[b].t).slice(0, keys.length - 40).forEach(k=>delete o[k]);
    localStorage.setItem(WX_LS, JSON.stringify(o));
  }catch(e){ /* storage full or blocked: memory cache still works */ }
}
async function wxCached(key, ttl, fn){
  const now = Date.now(), ls = wxLsRead(), hit = wxMem.get(key) || ls[key];
  if(hit && now - hit.t < ttl) return hit.v;
  try{
    const v = await fn(), rec = {t:now, v};
    wxMem.set(key, rec); ls[key] = rec; wxLsWrite(ls);
    return v;
  }catch(e){
    if(hit){ wxStale = true; return hit.v; }
    throw e;
  }
}
function wxDrop(prefix){
  [...wxMem.keys()].forEach(k=>{ if(k.startsWith(prefix)) wxMem.delete(k); });
  const ls = wxLsRead(); Object.keys(ls).forEach(k=>{ if(k.startsWith(prefix)) delete ls[k]; }); wxLsWrite(ls);
}

/* live data (updates every ~25 min) */
const wxCore = loc=>wxCached('core|' + loc, 25*60e3, async()=>{
  const j = await wxJson(wxUrl('https://api.open-meteo.com/v1/forecast', loc,
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_gusts_10m`
    + `&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m,is_day&daily=${WX_FDAILY}&forecast_days=16`));
  Object.keys(j.hourly || {}).forEach(k=>{ if(Array.isArray(j.hourly[k])) j.hourly[k] = j.hourly[k].slice(0, 48); });   // only the next day or so is needed
  j._t = Date.now();
  return j;
});
const wxPast = loc=>wxCached('past|' + loc, 6*3600e3, ()=>wxJson(wxUrl('https://api.open-meteo.com/v1/forecast', loc, `&daily=${WX_FDAILY}&past_days=92&forecast_days=1`)).then(j=>j.daily));
const wxArchive = (loc, s, e)=>wxCached(`arc|${loc}|${s}|${e}`, 30*864e5, ()=>wxJson(wxUrl('https://archive-api.open-meteo.com/v1/archive', loc, `&start_date=${s}&end_date=${e}&daily=${WX_ADAILY}`)).then(j=>j.daily));

/* typical weather for a date window: average of the same dates (+-2 days) over the previous 5 years */
function wxTypicalDay(hist, i){
  const rows = [];
  hist.forEach(d=>{
    for(let o = i; o <= i + 4; o++){
      if(d.temperature_2m_max && d.temperature_2m_max[o] != null){
        rows.push({code:d.weather_code[o], hi:d.temperature_2m_max[o], lo:d.temperature_2m_min[o], pr:d.precipitation_sum[o] || 0, wind:d.wind_speed_10m_max[o] || 0});
      }
    }
  });
  if(!rows.length) return null;
  const avg = f=>rows.reduce((s, r)=>s + f(r), 0) / rows.length;
  const rainFrac = rows.filter(r=>r.pr >= 1).length / rows.length;
  const dry = rows.filter(r=>r.pr < 1 && r.code <= 3), counts = {};
  (dry.length ? dry : rows).forEach(r=>{ const c = r.code <= 1 ? 0 : r.code; counts[c] = (counts[c] || 0) + 1; });
  const mode = +Object.keys(counts).sort((a, b)=>counts[b] - counts[a])[0], wind = avg(r=>r.wind);
  let kind = wxKind(mode, 1, wind, 40);
  if(rainFrac >= 0.5) kind = 'rain';
  return {hi:avg(r=>r.hi), lo:avg(r=>r.lo), wind, rain:Math.round(rainFrac * 100), kind};
}
const wxTypicalWindow = (loc, startISO, n)=>wxCached(`typ|${loc}|${startISO.slice(5)}|${n}`, 30*864e5, async()=>{
  const y0 = new Date().getUTCFullYear();
  const res = await Promise.allSettled(Array.from({length:WX_HIST_YEARS}, (_, k)=>{
    const s = wxShiftYear(startISO, y0 - 1 - k);
    return wxJson(wxUrl('https://archive-api.open-meteo.com/v1/archive', loc, `&start_date=${wxAddDays(s, -2)}&end_date=${wxAddDays(s, n + 1)}&daily=${WX_ADAILY}`));
  }));
  const ok = res.filter(r=>r.status === 'fulfilled').map(r=>r.value.daily).filter(Boolean);
  if(!ok.length) throw new Error('no history');
  return Array.from({length:n}, (_, i)=>wxTypicalDay(ok, i));
});

/* the day list for any date window: live forecast, recorded weather, or typical weather */
function wxRainKind(kind, rainy){ return (rainy && !['rain', 'drizzle', 'storm', 'snow'].includes(kind)) ? 'rain' : kind; }
async function wxDaysFor(loc, startISO, n){
  const core = await wxCore(loc).catch(()=>null), fd = core && core.daily;
  const today = (fd && fd.time[0]) || wxIsoToday();
  const dates = Array.from({length:n}, (_, i)=>wxAddDays(startISO, i));
  const inF = d=>fd ? fd.time.indexOf(d) : -1;
  const needPast = [], needOld = [], needTyp = [];
  dates.forEach(d=>{
    if(inF(d) >= 0) return;
    if(d < today) (d >= wxAddDays(today, -92) ? needPast : needOld).push(d); else needTyp.push(d);
  });
  const past = needPast.length ? await wxPast(loc).catch(()=>null) : null;
  const old = needOld.length ? await wxArchive(loc, needOld[0], needOld[needOld.length - 1]).catch(()=>null) : null;
  const typ = needTyp.length ? await wxTypicalWindow(loc, startISO, n).catch(()=>null) : null;
  const fromDaily = (src, D, k, forecast)=>{
    const hi = D.temperature_2m_max[k]; if(hi == null) return null;
    const wind = D.wind_speed_10m_max[k], mm = D.precipitation_sum ? D.precipitation_sum[k] : null;
    const prob = forecast ? D.precipitation_probability_max[k] : null;
    let kind = wxKind(D.weather_code[k], 1, wind, 40);
    kind = wxRainKind(kind, forecast ? (prob >= 60) : (mm >= 2));
    return {src, hi, lo:D.temperature_2m_min[k], wind, mm, rain:prob, kind, uv:D.uv_index_max ? D.uv_index_max[k] : null,
      sunrise:D.sunrise ? D.sunrise[k] : null, sunset:D.sunset ? D.sunset[k] : null};
  };
  return dates.map((date, i)=>{
    let day = null, k;
    if((k = inF(date)) >= 0) day = fromDaily('forecast', fd, k, true);
    else if(date < today){
      if(past && (k = past.time.indexOf(date)) >= 0) day = fromDaily('recorded', past, k, false);
      else if(old && (k = old.time.indexOf(date)) >= 0) day = fromDaily('recorded', old, k, false);
    }else if(typ && typ[i]) day = Object.assign({src:'typical'}, typ[i]);
    return Object.assign({date, i, loc}, day || {src:null});
  });
}

const wxDeg = v=>Math.round(v) + '°';
const wxSvgSmall = p=>`<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

const WX_SRC = {forecast:'wxForecast', recorded:'wxRecorded', typical:'wxTypical'};
function wxRenderStrip(){
  const stripEl = wxEl('wxStrip'); if(!stripEl) return;
  const rangeEl = wxEl('wxRange'), place = tr(wxTab === 'trip' ? 'wxTripTitle' : (wxLoc === 'gr' ? 'wxGR' : 'wxCT'));
  if(wxTab === 'trip') rangeEl.textContent = tr('wxTripTitle');
  else if(wxShown.length) rangeEl.textContent = `${wxFmt(wxShown[0].date, {day:'numeric', month:'short', year:'numeric'})} – ${wxFmt(wxShown[wxShown.length - 1].date, {day:'numeric', month:'short', year:'numeric'})} · ${place}`;
  else rangeEl.textContent = place;
  if(wxLoadingStrip){ stripEl.innerHTML = `<div class="wx-load">${escHtml(tr('wxLoading'))}</div>`; wxEl('wxDetail').innerHTML = ''; return; }
  const usable = wxShown.filter(d=>d.src);
  if(!usable.length){ stripEl.innerHTML = `<div class="wx-load">${escHtml(tr('wxFail'))}</div>`; wxEl('wxDetail').innerHTML = ''; return; }

async function wxTiles(){

/* ---------- CURRENCY ---------- */
// Every price in this page's data is already stored as a SAR number (fixed-rate converted at
// authoring time — see the travel-notice caption: 1 ZAR ~= 0.21 SAR, and SAR is itself pegged
// at exactly 3.75 to the US dollar). To offer a *live* conversion without rewriting every price
// in the dataset back to ZAR, we recover each stored SAR figure's implied ZAR amount using that
// same fixed authoring rate, then apply today's live rate on top of that recovered ZAR amount.
const FX_AUTHOR_RATE = 0.21;   // ZAR -> SAR, as used when the prices in this page were written
const FX_SAR_PER_USD = 3.75;   // real, fixed peg — not an estimate
let FX_LIVE = null;            // {SAR, USD} = how many of each 1 ZAR buys, once fetched
let CURRENCY = 'SAR', TRAVELERS = 2, SPLIT_PER_PERSON = false;
try{ CURRENCY = localStorage.getItem('ctgr_currency') || 'SAR'; }catch(e){}
try{ TRAVELERS = Math.max(1, Math.min(12, parseInt(localStorage.getItem('ctgr_travelers'), 10) || 2)); }catch(e){}
try{ SPLIT_PER_PERSON = localStorage.getItem('ctgr_split') === '1'; }catch(e){}
function fxRate(cur){
  if(cur === 'ZAR') return 1;
  if(cur === 'SAR') return (FX_LIVE && FX_LIVE.SAR) || FX_AUTHOR_RATE;
  return (FX_LIVE && FX_LIVE.USD) || (FX_AUTHOR_RATE / FX_SAR_PER_USD);   // USD
}
function money(sar){
  if(sar == null) return '';
  const zar = sar / FX_AUTHOR_RATE;
  const val = Math.round(zar * fxRate(CURRENCY));
  const locale = LANG === 'ar' ? 'ar' : 'en-US';
  const n = val.toLocaleString(locale);
  return CURRENCY === 'USD' ? '$' + n : (CURRENCY === 'ZAR' ? 'R ' + n : 'SAR ' + n);
}
async function fxLoad(){
  try{
    FX_LIVE = await wxCached('fx|zar', 6 * 3600e3, async()=>{
      const r = await fetch('https://open.er-api.com/v6/latest/ZAR');
      if(!r.ok) throw new Error('fx http ' + r.status);
      const d = await r.json();
      if(d.result !== 'success' || !d.rates || !d.rates.SAR) throw new Error('fx bad payload');
      return {SAR: d.rates.SAR, USD: d.rates.USD};
    });
  }catch(e){ /* keep the fixed fallback rate — same one the prices were authored at */ }
  updateBudget(); renderDrawer(); renderAreas(); renderGardenRoute(); renderPlanItinerary();
}
function setCurrency(cur){
  CURRENCY = cur;
  try{ localStorage.setItem('ctgr_currency', cur); }catch(e){}
  updateBudget(); renderDrawer(); renderAreas(); renderGardenRoute(); renderPlanItinerary();
}
function setTravelers(n){
  TRAVELERS = Math.max(1, Math.min(12, n));
  try{ localStorage.setItem('ctgr_travelers', String(TRAVELERS)); }catch(e){}

}
function setSplitPerPerson(on){
  SPLIT_PER_PERSON = on;
  try{ localStorage.setItem('ctgr_split', on ? '1' : '0'); }catch(e){}

}
function budgetDisplay(total){
  const t = SPLIT_PER_PERSON ? total / TRAVELERS : total;
  const suffix = SPLIT_PER_PERSON ? (LANG === 'ar' ? ' / للشخص' : ' / person') : '';
  return money(t) + suffix;
}

function computeBudget(){

  picked.forEach(idx=>{ const p=PLACES[idx]; if(p){ total+=(p.price||0); count++; } });

  grPicked.forEach(idx=>{ const item=grFlat[idx]; if(item){ total+=(item.price||0); count++; } });
  return {total, count};
}

function buildSearchIndex(){
  const idx = [];

  });
  GARDEN_ROUTE.forEach(t=>{
    t.items.forEach(item=>{
      idx.push({n:item.n, n_ar:item.n_ar, g:item.g, rating:item.rating, cat:CATS.en[item.c]?.label||item.c, cat_ar:CATS.ar[item.c]?.label||item.c, area:t.town, area_ar:t.town_ar, color:{activity:"#1f5f6b",restaurant:"#e2622e",coffee:"#8a4fae",shop:"#c9942f"}[item.c]||"#6f8c5f", tab:'gardenroute'});
    });

  SAFARI.forEach(s=>{
    idx.push({n:s.n, n_ar:s.n_ar, g:s.g, rating:s.rating, cat:LANG==='ar'?'سفاري':'Safari', cat_ar:'سفاري', area:'', area_ar:'', color:"#8a4fae", tab:'safari'});

let SEARCH_INDEX = null;
function runSearch(q){
  const resultsEl = document.getElementById('searchResults');
  if(!q || q.trim().length<2){ resultsEl.style.display='none'; resultsEl.innerHTML=''; return; }
  if(!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();
  const ql = q.trim().toLowerCase();
  const matches = SEARCH_INDEX.filter(it=>{
    const name = (LANG==='ar' ? it.n_ar : it.n) || it.n || '';
    return name.toLowerCase().includes(ql) || (it.n||'').toLowerCase().includes(ql) || (it.n_ar||'').includes(q.trim());
  }).slice(0,25);
  if(matches.length===0){
    resultsEl.innerHTML = `<div class="sr-empty">${LANG==='ar'?'لا نتائج':'No results'}</div>`;
    resultsEl.style.display='block';
    return;
  }
  resultsEl.innerHTML = matches.map(it=>{
    const name = LANG==='ar' ? it.n_ar : it.n;
    const cat = LANG==='ar' ? it.cat_ar : it.cat;
    const area = LANG==='ar' ? it.area_ar : it.area;
    return `<a class="sr-item" href="${it.g}" target="_blank" data-tab="${it.tab}"><span class="sr-dot" style="background:${it.color}"></span><span class="sr-name">${name}</span><span class="sr-meta">${cat}${area?' · '+area:''}${it.rating?' · ★'+it.rating.toFixed(1):''}</span></a>`;
  }).join('');
  resultsEl.style.display='block';
  resultsEl.querySelectorAll('.sr-item').forEach(a=>{
    a.addEventListener('click', ()=>{
      const tabBtn = document.querySelector(`.maintab[data-tab="${a.dataset.tab}"]`);

  // the CSS animation above only plays at the exact moment autofill happens.
  searchInputEl.addEventListener('animationstart', e=>{
    if(e.animationName === 'ctgrAutofillStart' && searchInputEl.value && !searchInputEl.dataset.userTyped){
      searchInputEl.value = '';
      runSearch('');
    }
  });
  searchInputEl.addEventListener('input', ()=>{ searchInputEl.dataset.userTyped = '1'; });
  searchInputEl.addEventListener('input', (e)=> runSearch(e.target.value));
  searchInputEl.addEventListener('focus', (e)=> { if(e.target.value.trim().length>=2) runSearch(e.target.value); });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')){ document.getElementById('searchResults').style.display='none'; }
  });
}

/* ---------- SCROLL TO TOP / BOTTOM ---------- */
(function(){
  const fabTop = document.getElementById('fabTop'), fabBottom = document.getElementById('fabBottom');
  if(!fabTop || !fabBottom) return;
  let ticking = false;
  function update(){
    ticking = false;
    const y = window.scrollY || document.documentElement.scrollTop;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    fabTop.classList.toggle('show', y > 500);
    fabBottom.classList.toggle('show', maxScroll > 500 && y < maxScroll - 400);
  }
  function requestUpdate(){ if(!ticking){ ticking = true; requestAnimationFrame(update); } }
  window.addEventListener('scroll', requestUpdate, {passive:true});
  window.addEventListener('resize', requestUpdate);
  fabTop.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
  fabBottom.addEventListener('click', ()=> window.scrollTo({top:document.documentElement.scrollHeight, behavior:'smooth'}));
  window.scrollFabsUpdate = requestUpdate;
  update();
})();
</script>
